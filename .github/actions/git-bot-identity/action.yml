name: Git bot identity
description: >-
  Configure git's author/committer identity for commits a workflow makes
  on its own behalf. The account's numeric user ID is looked up at run
  time rather than hardcoded: GitHub's noreply form is
  "<id>+<login>@users.noreply.github.com", and it is the numeric prefix
  that makes a commit resolve to the account's profile instead of showing
  as an unattributed author string. Retried with backoff, since this adds
  a network dependency to any job that commits.

inputs:
  account:
    description: >-
      Login of the account to attribute commits to. Defaults to the
      built-in Actions bot, which is who commits made with GITHUB_TOKEN
      come from.
    required: false
    default: github-actions[bot]
  path:
    description: >-
      Repository checkout to configure, relative to the workspace.
      Defaults to the workspace root; set it when the repo that will
      commit is a secondary checkout in a subdirectory (e.g. a gh-pages
      checkout beside the default-branch checkout that provides this
      action).
    required: false
    default: "."
  retries:
    description: Maximum lookup attempts before giving up.
    required: false
    default: "3"
  token:
    description: >-
      Token used for the user lookup. GITHUB_TOKEN is sufficient — the
      endpoint only reads public profile data.
    required: true

outputs:
  email:
    description: The resolved "<id>+<login>@users.noreply.github.com" address.
    value: ${{ steps.resolve.outputs.email }}
  id:
    description: The account's numeric GitHub user ID.
    value: ${{ steps.resolve.outputs.id }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        ACCOUNT: ${{ inputs.account }}
        GH_TOKEN: ${{ inputs.token }}
        REPO_PATH: ${{ inputs.path }}
        RETRIES: ${{ inputs.retries }}
      run: |
        set -euETo pipefail
        shopt -s inherit_errexit 2>/dev/null || :

        # Logins can contain characters that are not URL-safe — the
        # default "github-actions[bot]" contains brackets.
        encoded="$(printf '%s' "${ACCOUNT}" | jq -sRr @uri)"

        lookup() {
          gh api "users/${encoded}" --jq '.id'
        }

        attempt=1
        id=""
        while [ "${attempt}" -le "${RETRIES}" ]; do
          if id="$(lookup)" && [ -n "${id}" ]; then
            echo "Resolved ${ACCOUNT} to user ID ${id} on attempt ${attempt}"
            break
          fi
          echo "User lookup for ${ACCOUNT} attempt ${attempt} failed"
          id=""
          if [ "${attempt}" -lt "${RETRIES}" ]; then
            backoff=$((attempt * 5))
            echo "Retrying in ${backoff}s..."
            sleep "${backoff}"
          fi
          attempt=$((attempt + 1))
        done

        if [ -z "${id}" ]; then
          echo "::error::Could not resolve user ID for ${ACCOUNT} after ${RETRIES} attempt(s)"
          exit 1
        fi

        email="${id}+${ACCOUNT}@users.noreply.github.com"
        git -C "${REPO_PATH}" config user.name "${ACCOUNT}"
        git -C "${REPO_PATH}" config user.email "${email}"
        echo "email=${email}" >>"${GITHUB_OUTPUT}"
        echo "id=${id}" >>"${GITHUB_OUTPUT}"
