name: Warm IFD sources
description: >-
  Pre-realize IFD-backed flake sources before a later eval. Our overlays read
  fetchFromGitHub outputs at eval time — to compute versions, and to build
  vendor sets from a lockfile inside the fetched source (IFD); fresh runners
  haven't realized those sources, so a transient fetch blip during a
  build/check/pipeline eval fails the whole job. This warms them first, retried
  with backoff per system. Best-effort by default (warn and continue so it never
  adds a new hard failure); set best-effort to "false" to make a warm failure
  fail the step.

inputs:
  best-effort:
    description: >-
      "true" → warn and continue if a system exhausts its retries (never fails
      the step). "false" → exit nonzero so the step fails the job.
    required: false
    default: "true"
  retries:
    description: Maximum warm attempts per system before giving up.
    required: false
    default: "3"
  systems:
    description: >-
      Space-separated nix systems to warm, e.g. "x86_64-linux" or "x86_64-linux
      aarch64-darwin". IFD source fetches are system-agnostic, so warming an
      off-runner system is fine.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BEST_EFFORT: ${{ inputs.best-effort }}
        RETRIES: ${{ inputs.retries }}
        SYSTEMS: ${{ inputs.systems }}
      run: |
        set -euETo pipefail
        shopt -s inherit_errexit 2>/dev/null || :

        # Force `drvPath`, NOT `version`. `version` reaches an IFD only
        # when the version is itself readFile-derived FROM the source. A
        # package versioned from a `-sources.json` sidecar resolves it out
        # of the sidecar and short-circuits, so IFD elsewhere on its path
        # — `cargoLock.lockFile`, say — was never warmed. Measured on
        # fblog under `--option allow-import-from-derivation false`:
        # `.version` evaluates clean, `.drvPath` fails with "cannot build
        # '…-source.drv^out' during evaluation". `drvPath` subsumes
        # `version` (the derivation name embeds it), so nothing is lost.
        #
        # It is not free. Forcing every package through `derivationStrict`
        # measured 1.2s / 0.9 GB RSS -> 19.2s / 3.0 GB on x86_64-linux and
        # 23.4s / 3.8 GB on aarch64-darwin (eval cache disabled, warm
        # store, 2026-07-25). That is the cost of warming the
        # sidecar-versioned packages at all, and it is bounded eval work
        # the consuming job would do anyway.
        #
        # The `--apply` expression is load-bearing and shared by ci.yml,
        # devenv-test.yml and update.yml — keep it in sync with
        # dev/fragments/overlays/ifd-patterns.md.
        warm() {
          nix eval --json \
            --option allow-import-from-derivation true \
            --apply 'pkgs: builtins.mapAttrs (_: p: p.drvPath or p.name or "unknown") pkgs' \
            ".#packages.$1" >/dev/null
        }

        warm_system() {
          local system=$1
          local attempt=1 backoff
          while [ "${attempt}" -le "${RETRIES}" ]; do
            if warm "${system}"; then
              echo "IFD warm (${system}) succeeded on attempt ${attempt}"
              return 0
            fi
            echo "IFD warm (${system}) attempt ${attempt} failed"
            if [ "${attempt}" -lt "${RETRIES}" ]; then
              backoff=$((attempt * 15))
              echo "Retrying in ${backoff}s..."
              sleep "${backoff}"
            fi
            attempt=$((attempt + 1))
          done
          return 1
        }

        read -r -a systems_arr <<<"${SYSTEMS}"
        rc=0
        for system in "${systems_arr[@]}"; do
          if warm_system "${system}"; then
            continue
          fi
          if [ "${BEST_EFFORT}" = "true" ]; then
            echo "::warning::IFD warm (${system}) failed after ${RETRIES} attempt(s); continuing (best-effort)"
          else
            echo "::error::IFD warm (${system}) failed after ${RETRIES} attempt(s)"
            rc=1
          fi
        done
        exit "${rc}"
