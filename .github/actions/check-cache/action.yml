name: CI check cache
description:
  Configure the pinned Hestia cache with the same upstream filters in every job.

inputs:
  read-only:
    description: Consume the cache without registering built paths.
    default: "false"
  wait-manifest-version:
    description: Wait for the evaluating job's registered derivation closures.
    default: "0"

runs:
  using: composite
  steps:
    - name: Obtain patched Hestia
      id: binary
      shell: bash
      env:
        NON_DEFAULT_REF:
          ${{ github.ref != format('refs/heads/{0}',
          github.event.repository.default_branch) }}
      run: |
        set -euETo pipefail
        shopt -s inherit_errexit 2>/dev/null || :
        package="$(nix build --no-link --print-out-paths .#.ciHestia.x86_64-linux)"
        binary="$package/bin/hestia"
        if [[ "$NON_DEFAULT_REF" == true ]]; then
          binary="$RUNNER_TEMP/hestia-family"
          printf '#!/usr/bin/env bash\nset -euETo pipefail\nshopt -s inherit_errexit 2>/dev/null || :\n' > "$binary"
          printf 'hestia=%q\n' "$package/bin/hestia" >> "$binary"
          cat >> "$binary" <<'EOF'
        if [[ "${1:-}" == serve ]]; then
          exec "$hestia" "$@" --manifest-prefix m3pr --base-manifest-prefix m3
        fi
        exec "$hestia" "$@"
        EOF
          chmod +x "$binary"
        fi
        printf 'path=%s\n' "$binary" >> "$GITHUB_OUTPUT"
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      with:
        # A supplied binary bypasses the action's release attestation check.
        binary: ${{ steps.binary.outputs.path }}
        # Retain devenv-signed evaluation inputs; exclude public dependencies.
        upstream-cache-filter: "true"
        upstream-cache-key-names:
          cache.nixos.org-1 nix-agentic-tools.cachix.org-1
        filter-drv-closures: "true"
        read-only: ${{ inputs.read-only }}
        wait-manifest-version: ${{ inputs.wait-manifest-version }}
