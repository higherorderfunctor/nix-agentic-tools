name: Assert nix config applied
description: >-
  Fail loudly when `nix config show` is missing settings the preceding installer
  step was supposed to apply.

  cachix/install-nix-action's install-nix.sh exits 0 WITHOUT writing any config
  when nix is already on PATH ("Aborting: Nix is already installed"). A runner
  image that ships nix would therefore turn the install step green while
  silently dropping every extra_nix_config line — no numtide substituter, no
  accept-flake-config — and the first symptom would be an unexplained cache miss
  or an eval failure far from the cause. The action this replaced on darwin
  failed loudly instead (nix-quick-install.sh exits 1), so this assertion is
  what preserves that property.

  Same doctrine as the cache positive control in ci.yml: a step that can only
  pass is worse than no step at all. So this one was checked against its own
  rule on 2026-08-14 — an absent substituter exits 1, a present one exits 0, and
  a key present with the WRONG value (`accept-flake-config = false`) exits 1.
  That last case is the point: it matches on values, not key names, so a config
  written with the setting disabled still fails.

inputs:
  require:
    description: >-
      Newline-separated extended-regex patterns. Each must match at least one
      line of `nix config show`, or the step fails.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUIRE: ${{ inputs.require }}
      run: |
        set -euETo pipefail
        shopt -s inherit_errexit 2>/dev/null || :

        conf="$(nix config show)"

        rc=0
        while IFS= read -r pattern; do
          [ -n "$pattern" ] || continue
          if ! printf '%s\n' "$conf" | command grep -Eq -- "$pattern"; then
            echo "::error::nix config has no line matching '${pattern}' -" \
              "the installer step reported success without applying its" \
              "configuration"
            rc=1
          fi
        done <<< "$REQUIRE"

        if [ "$rc" -ne 0 ]; then
          echo "::group::nix config show"
          printf '%s\n' "$conf"
          echo "::endgroup::"
        fi

        exit "$rc"
