name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# TODO: remove once DeterminateSystems/nix-installer-action ships node24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job in this repository carries `timeout-minutes: 60`. GitHub has no
# repository- or workflow-level default for it — `defaults:` covers only `run`
# — so the value is repeated per job rather than derived. An UNSET timeout is
# not "no policy", it is 6 HOURS, which lets one hung process burn a runner all
# day before anyone notices.
#
# 60 is a ceiling for a hung job, NOT a budget any job is expected to approach.
# The one job measured against it, `devenv-test`, tops out around 42m cold; see
# the note on its own timeout for why 45 was too tight. Do not read this number
# as headroom to spend.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # ONE installer for both legs: cachix/install-nix-action, the upstream
      # MULTI-USER installer. On darwin that is a deliberate wall-clock
      # regression bought to kill a hang, and it is UNDER TESTING — see the
      # re-check list below before treating it as settled.
      #
      # WHY darwin left nixbuild/nix-quick-install-action: that action installs
      # a single-user /nix owned by the runner, so every nix process opens
      # LocalStore directly and contends on the store big-lock. It also pins
      # nix 2.34.7, so the DB it creates never carries the
      # 20260309-drop-redundant-indexreferrer migration that nix >= 2.35 adds
      # (local-store.cc:638). The first 2.35 process to open that store —
      # nix-fast-build's own bundled nix — therefore requests the EXCLUSIVE
      # big-lock (local-store.cc:341-343, logging "waiting for exclusive
      # access to the Nix store..."). Cachix's daemon holds a SHARED lock for
      # its whole lifetime and that exclusive request has NO timeout, so
      # whichever side loses the start-up race hangs until the 60m ceiling.
      # Hit twice on PR #933 (runs 31801539425, 31830042311), both killed at
      # 1h00m with orphaned nix-eval-jobs and cachix processes.
      #
      # The daemon install closes it twice over: clients resolve to
      # UDSRemoteStore and never take the big-lock at all, and install-nix.sh
      # pins nix 2.35.2, so the DB is created with the migration applied.
      #
      # COST, measured here: install-nix-action medians 31s on macos-latest vs
      # 4s on ubuntu (n=23 each, pre-2026-07-21); nix-quick-install's median
      # was 5s on macos-latest (n=8, range 2-10s). darwin pays ~26s. It
      # cannot be tuned away in place — install-nix.sh already passes
      # --daemon-user-count $(cpu_count * 2), so NIX_USER_COUNT is a no-op.
      # Both installers carve an APFS volume for /nix; the comment that used to
      # sit here claimed quick-install reused "the same volume" and that was
      # wrong. The real difference is build-user and launchd provisioning.
      #
      # UNDER TESTING — do not mark settled without re-checking:
      #   - max-jobs goes 1 -> auto (3 here). install-nix.sh writes
      #     `max-jobs = auto`; quick-install wrote none, so nix's default of 1
      #     applied. nix-fast-build sizes its build pool straight from it, and
      #     warm-ifd's eval alone peaks near 3.8 GB RSS on a 3-core / 7 GB
      #     runner. This is a bigger unknown than the 31s. If runs get slower
      #     or OOM, pin `max-jobs = 1` below before blaming the installer.
      #   - always-allow-substitutes = true is new on darwin, which changes
      #     which paths this leg ends up pushing to cachix.
      #   - @v31 is a MOVING tag: nix went 2.34.7 -> 2.35.2 under it in four
      #     months. Re-pin with install_url if that ever bites.
      #   - the 31s baseline predates the current runner image and has not been
      #     re-measured since the swap back.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - uses: cachix/cachix-action@v17
        with:
          name: nix-agentic-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # cachix-action pushes built paths automatically when
          # authToken is set and the push target matches

      # Warm the flake eval cache BEFORE the build. Our overlays use IFD
      # (builtins.readFile on fetchFromGitHub) to compute versions at eval
      # time; fresh runners haven't realized these sources, so the build's
      # own eval would fetch them and a transient network blip ("HTTP2
      # framing layer") fails the whole job. Best-effort: if all attempts
      # fail we warn and continue — the build step still gets its own eval.
      # Only this runner's system, and nothing else covers the other one:
      # the test job runs a plain `nix flake check`, which evaluates ONLY
      # its own runner's system. This matrix leg is the repo's ONLY
      # aarch64-darwin coverage, evaluation included.
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: ${{ matrix.system }}

      # Resolve nix-fast-build from THIS flake's pinned `nix-fast-build`
      # input (flake.nix), matching devenv.nix, generate-update-ninja.nix
      # and dev/scripts/update-input.sh — the update pipeline bumps that
      # input, so CI must exercise the version the repo actually pins.
      # The previous `nix profile add nixpkgs#nix-fast-build` pulled a
      # DIFFERENT derivation out of a second, unpinned nixpkgs, unpacking
      # the nixpkgs-unstable channel tarball in every job and sharing
      # neither eval cache nor store paths with the flake evaluated by
      # the very next step.
      - name: Build all packages
        run: |
          nix run --inputs-from . nix-fast-build -- \
            --flake ".#packages.${{ matrix.system }}" \
            --select 'packages: builtins.removeAttrs packages [
              "instructions-agents"
              "instructions-claude"
              "instructions-copilot"
              "instructions-kiro"
              "kiro-cli-workflows"
              "repo-contributing"
              "repo-readme"
            ]' \
            --skip-cached \
            --cachix-cache nix-agentic-tools \
            --no-link

      # Semble intentionally keeps Numtide's derivation identity, so package
      # builds substitute it from cache.numtide.com. On authenticated main
      # builds, explicitly mirror the realized runtime closure into this
      # project's cache; Cachix skips closure paths already served by the
      # runner's other configured caches.
      - name: Mirror Semble into project cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          semble_path="$(nix build ".#packages.${{ matrix.system }}.semble" \
            --no-link --print-out-paths)"
          printf '%s\n' "$semble_path" | cachix push nix-agentic-tools

          store_name="${semble_path##*/}"
          store_hash="${store_name%%-*}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --head \
              "https://nix-agentic-tools.cachix.org/${store_hash}.narinfo" \
              >/dev/null; then
              echo "Semble is queryable from nix-agentic-tools.cachix.org"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Semble was pushed but its narinfo is not queryable" >&2
              exit 1
            fi
            sleep "$attempt"
          done

  # The workflows unlock patches Kiro's proprietary binary. Validate that
  # patch on both supported systems without distributing the result through
  # our public Cachix cache. This job intentionally does not install
  # cachix-action, and the command overrides the flake's substituters so a
  # previously uploaded patched output cannot turn this into a cache-hit-only
  # test. Consumers who opt into the unlock apply the patch locally too.
  #
  # Named for what it ASSERTS, not where it runs. It was `kiro-workflows-local`
  # and that read as "runs on your machine" — it never did; "local" meant the
  # artifact stays local. Renaming it changes the status-check CONTEXT, so the
  # branch ruleset's required-checks list has to move with it.
  #
  # ALWAYS-REPORTING, deliberately: the JOB always runs and the expensive steps
  # are gated on `steps.scope.outputs.needed`, matching devenv-test. A required
  # check that is genuinely SKIPPED never reports a conclusion, and GitHub
  # blocks the PR forever waiting for it — so "make it required" and "skip it
  # when irrelevant" can only coexist in this shape.
  kiro-patched:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Only inputs that can move `kiro-cli-workflows`'s store path. A
      # context7-mcp bump touches `overlays/mcp-servers/` and cannot, so it
      # should not pay for a 621 MiB build on two runners.
      #
      # `flake.lock` is the nixpkgs axis (stdenv/bash moving is exactly what
      # forks these outputs); `overlays/lib.nix` carries mkKiroRolloutPatch,
      # kiroRolloutVerify and the chat locator; `overlays/default.nix` carries
      # the unfree guard that wraps the output. Deliberately NOT
      # `packages/kiro-cli/**` — that is the HM/devenv module, which no flake
      # package derivation reads.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          needed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            needed=false
            changed_files="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[].filename'
            )"

            while IFS= read -r changed_file; do
              case "$changed_file" in
                .github/actions/warm-ifd/* | \
                  .github/workflows/ci.yml | \
                  flake.lock | \
                  flake.nix | \
                  overlays/default.nix | \
                  overlays/kiro-cli* | \
                  overlays/lib.nix)
                  needed=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "patched Kiro validation needed: ${needed}"

      # Same single installer as the `build` job — see the long note there for
      # the deadlock that drove darwin off nix-quick-install-action.
      #
      # This job never deadlocked and could have kept the fast installer: it
      # installs no cachix-action, so nothing holds a shared big-lock while
      # `nix build` runs, which is why its darwin leg passed in 2m40s inside
      # the very runs where `build` hung. It moves anyway so there is ONE
      # macOS installer story rather than two, and so darwin stops running a
      # different nix (2.34.7) than every other leg (2.35.2) — that skew is
      # what made the hang possible in the first place.
      #
      # UNDER TESTING, and this is the leg to watch: its darwin builds have
      # never run under a multi-user daemon, so they move from running as
      # `runner` to `_nixbld*`. The ad-hoc codesign-then-exec assertion in
      # overlays/lib.nix should not care — `--sign -` needs no keychain and
      # Mach-O validity is not uid-dependent — but that is inference, not
      # measurement, on a required check.
      - if: steps.scope.outputs.needed == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # This only realizes the IFD sources used during evaluation. It has no
      # Cachix credentials and does not build the patched Kiro output; the
      # build below still removes the project cache from its substituters.
      - name: Warm IFD sources (retry, best-effort)
        if: steps.scope.outputs.needed == 'true'
        uses: ./.github/actions/warm-ifd
        with:
          systems: ${{ matrix.system }}

      - name: Build patched Kiro without the project cache
        id: build-patched
        if: steps.scope.outputs.needed == 'true'
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          out="$(nix build ".#packages.${{ matrix.system }}.kiro-cli-workflows" \
            --no-link --print-out-paths \
            --option extra-substituters "" \
            --option substituters "https://cache.nixos.org https://devenv.cachix.org")"
          printf 'out=%s\n' "$out" >> "$GITHUB_OUTPUT"

      # TRIPWIRE. The exclusion above and update.yml's pushFilter are both
      # configuration, and this repo already learned that a mitigation with an
      # unwatched hole reads exactly like a working one: #665 excluded this
      # attribute from the cache-writing build and the patched binary was
      # published anyway for eleven days, through update.yml's whole-package-set
      # verification build. So assert the OUTCOME rather than trusting either
      # knob — ask the cache directly whether the patched closure is fetchable.
      #
      # This runs here because the job already has the paths and needs no
      # credentials (a narinfo GET is public), and because a `nix flake check`
      # derivation is sandboxed and cannot reach the network at all.
      - name: Assert the patched output is not published
        if: steps.scope.outputs.needed == 'true'
        env:
          OUT: ${{ steps.build-patched.outputs.out }}
          CACHE: https://nix-agentic-tools.cachix.org
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          # Positive control FIRST. Every assertion below is "the answer was
          # not 200", which a typo'd host would satisfy unconditionally — a
          # tripwire that can only pass is worse than none. The cache-info
          # endpoint is always 200 for a live cache and, unlike any store
          # path, does not go missing right after a version bump.
          if ! curl --fail --silent --show-error "$CACHE/nix-cache-info" >/dev/null; then
            echo "::error::positive control failed: $CACHE is unreachable, so the" \
                 "checks below prove nothing"
            exit 1
          fi

          # Assert only on paths UNIQUE to the patched closure. Some FHS
          # scaffolding — the `-init` scripts and `-fhsenv-profile` trees — does
          # not depend on the binary's CONTENT, so it is byte-identical for both
          # variants and shares one store path, which the build job publishes
          # legitimately as part of the unpatched package. Walking the whole
          # closure therefore reported six such paths as leaks on linux (darwin
          # has no FHS layer, so it passed and hid the bug). Those carry no
          # patched bytes; flagging them would train the reader to ignore this
          # step, which is worse than not having it.
          #
          # `nix derivation show -r` is eval-only — it reads each derivation's
          # DECLARED output paths without building or substituting the 621 MiB
          # unpatched closure onto the runner.
          # Compare BASENAMES, not full paths. `nix derivation show` changed
          # what `.outputs[].path` returns between the version used locally and
          # the one on the runner:
          #
          #   nix 2.34.4  /nix/store/ci1dlr8x…-coreutils-9.11
          #   nix 2.35.1  ci1dlr8x…-coreutils-9.11
          #
          # so a full-path comparison silently matched NOTHING on CI while
          # passing locally, and every shared path was reported as a leak. The
          # store hash plus name identifies the path either way, so normalizing
          # both sides with `s|.*/||` is correct under both and cannot drift
          # again on this axis. `// empty` drops the one null that schema also
          # produces for outputs carrying no path.
          base_names="$(
            nix derivation show -r ".#packages.${SYSTEM}.kiro-cli" \
              | jq -r '(.derivations // .) | to_entries[].value.outputs[]?.path // empty' \
              | sed 's|.*/||' \
              | sort -u
          )"
          nl=$'\n'
          base_nl="${nl}${base_names}${nl}"

          # Fail CLOSED on an unusable base set. Emptiness is not the only way
          # this breaks — the schema change above yielded a large, well-formed,
          # entirely USELESS list, which a `-z` test happily accepted. Requiring
          # a kiro entry is what actually proves the enumeration describes the
          # package under test, and it turns the next such drift into one loud
          # line instead of six false leak reports.
          if [ -z "$base_names" ]; then
            echo "::error::could not enumerate the unpatched closure — refusing to" \
                 "assert, since every patched path would look unique and pass"
            exit 1
          fi
          case "$base_nl" in
            *kiro*) ;;
            *)
              echo "::error::the unpatched closure enumerated paths but none named" \
                   '*kiro* — "nix derivation show" output shape probably changed' \
                   "again. Refusing to assert."
              exit 1
              ;;
          esac

          published=0
          while read -r path; do
            name="${path##*/}"
            case "$name" in *kiro*) ;; *) continue ;; esac
            # Pure-bash membership test, NOT `printf … | grep -qxF`. That
            # spelling fails here in the direction that matters: `grep -q`
            # exits on the first match, `printf` is then still writing, takes
            # SIGPIPE (141), and `pipefail` reports 141 for the pipeline — so a
            # SUCCESSFUL match reads as FALSE, every shared path falls through
            # to being asserted, and the step reports six leaks that are not
            # leaks.
            #
            # It is SIZE-DEPENDENT, which is what makes it easy to "fix" and
            # re-break: below the ~64 KiB pipe buffer `printf` finishes before
            # `grep` exits, no SIGPIPE occurs, and the bug is invisible. This
            # closure is ~95 KB across ~1730 paths, so it is over the line.
            # Two synthetic repros at 2 lines and at 35 KB both PASSED before
            # the real list reproduced it — do not test this with a small
            # fixture. (Under `pipefail` only; an ad-hoc shell without it also
            # hides the bug.)
            #
            # A `<<<` herestring would fix it too; this also avoids forking a
            # grep per path.
            case "$base_nl" in
              *"${nl}${name}${nl}"*)
                echo "shared with the unpatched closure, not asserted: $name"
                continue
                ;;
            esac
            hash="${name%%-*}"
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "$CACHE/${hash}.narinfo")"
            # Only 404 proves absence. A transient failure reports 000 and a
            # 5xx reports the upstream error, and treating either as "not 200"
            # would let the tripwire pass without having asked anything — the
            # same can-only-pass failure the positive control above guards.
            case "$code" in
              404) echo "ok (absent): $name" ;;
              200)
                echo "::error::patched Kiro path is PUBLISHED: $path"
                published=$((published + 1))
                ;;
              *)
                echo "::error::inconclusive HTTP $code for $name — treating as failure"
                published=$((published + 1))
                ;;
            esac
          done < <(nix path-info --recursive "$OUT")

          if [ "$published" -ne 0 ]; then
            echo "::error::${published} patched path(s) failed the not-published" \
                 "assertion against $CACHE (published, or inconclusive — see above)." \
                 "Check update.yml's pushFilter and ci.yml's --select removeAttrs."
            exit 1
          fi
          echo "No patched Kiro path is fetchable from $CACHE."

  # Validation entrypoint: `nix flake check` is the single source of
  # truth for repo health (structural eval checks + formatting hard
  # gate via checks.<system>.formatting). Pre-commit hooks remain a
  # local-only fast subset; see devenv.nix's git-hooks.hooks comment
  # block for the architecture rationale.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: nix-agentic-tools

      # Warm the flake eval cache BEFORE the check. Same IFD-fetch flake as
      # the build job: overlays read fetchFromGitHub sources at eval time,
      # and a transient fetch blip fails the whole job. Best-effort: flake
      # check still gets its own eval if warm fails.
      #
      # `systems` names BOTH, but do NOT read that as darwin coverage.
      # Plain `nix flake check` reports "The check omitted these
      # incompatible systems: aarch64-darwin", and the step below does not
      # pass `--all-systems`, so this job evaluates x86_64-linux ONLY. The
      # repo's darwin coverage is the required aarch64-darwin leg of the
      # build job above — there is no darwin evaluation here to warm for.
      # The darwin entry is kept anyway because IFD source fetches are
      # system-agnostic and content-addressed, so it costs almost nothing
      # and stays correct if `--all-systems` is ever adopted.
      #
      # Adopting it is NOT a one-word change, and measuring that was the
      # point of writing this down. `--all-systems` only EVALUATES the
      # foreign system (it never builds it — verified on a throwaway
      # two-system flake), so the cost would be evaluation alone: roughly
      # +43s and a ~7.8 GB RSS ceiling, against a 36s / 6.2 GB linux
      # baseline. But instantiating the darwin checks on a linux host
      # currently FAILS outright, for two separate reasons:
      #   - IFD on derivations that must be BUILT for aarch64-darwin
      #     (living-workflow-skill.drv, stacked-workflows-skills.drv) —
      #     a linux runner cannot build those at all.
      #   - at least one real darwin assertion failure,
      #     module-mcp-services-rotation-restart-entry.
      # So `--all-systems` would turn this required check red today. Fix
      # those first; the flag is not the starting point.
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: x86_64-linux aarch64-darwin

      # The Semble customization smoke check builds a patched Semble here,
      # parses real AWK and jq samples, and exercises path-mapped discovery.
      # This job's Cachix client is read-only (no authToken), and that patched
      # derivation is deliberately absent from flake packages, so it is tested
      # without being published. Its nixpkgs grammar inputs are already
      # available through the Cachix nixpkgs follow.
      - name: Run flake checks
        run: nix flake check

      # ~90-day reminder to re-check the heron_brook delegation clamp
      # (ai.claude.delegationClamp, opt-in). A CALENDAR, not a gate on content:
      # it fires only past `reviewBy`, and only on the claude-code update PR.
      # The sweep opens one of those several times a week, so the reminder
      # surfaces within days of the date passing while never touching any other
      # PR. `head_ref` is empty on push events, so non-PR runs skip for free.
      #
      # It cannot live in a Nix check: reading the current date inside a
      # derivation is impure and would be cached. It is a STEP in `test` rather
      # than its own job so it needs no new required-context string that a job
      # rename could silently break — the same reasoning
      # checks/instructions-drift.nix records for living in `nix flake check`.
      #
      # The branch name below is generated as `update/<key>` from
      # config.update.targets. checks/claude-heron-brook.nix reads that name
      # back out of THIS file and fails if the key is renamed out from under it,
      # so this gate cannot silently stop matching.
      #
      # TO DISCHARGE — build the binary and grep it. The positive control is NOT
      # optional; a clean negative from an unverified grep on a ~275 MB binary
      # proves nothing:
      #   B=$(nix build --no-link --print-out-paths .#claude-code)/bin/claude
      #   grep -ac 'NotebookEdit' "$B"                            # control, must be >0
      #   grep -ac 'Do not call the AgentTool unless the user requested it' "$B"
      #                                                           # 0 => upstream fixed it
      #   grep -ac 'tengu_heron_brook' "$B"                       # the gate
      # Presence is the signal, never the count: grep counts LINES and the
      # bundle is minified, so counts drift with no behavior change.
      #
      # Then EITHER bump `reviewBy` ~90 days, OR — if upstream fixed it — delete
      # ai.claude.delegationClamp, this step, and checks/claude-heron-brook.nix.
      - name: Heron-brook mitigation review tripwire
        if: github.head_ref == 'update/claude-code'
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          tripwire=config/heron-brook-tripwire.json
          review_by="$(jq -r .reviewBy "$tripwire")"
          issue="$(jq -r .issue "$tripwire")"
          today="$(date -u +%F)"
          # Lexicographic compare is correct for ISO-8601 dates.
          if [[ "$today" > "$review_by" ]]; then
            echo "::error file=${tripwire}::heron_brook mitigation is past its ${review_by} review date (today ${today}). Re-check whether Claude Code still ships the delegation clamp — the grep procedure is in the comment above this step, and ${issue} tracks it upstream. Then EITHER bump reviewBy in ${tripwire}, OR delete ai.claude.delegationClamp, this step, and checks/claude-heron-brook.nix if upstream fixed it. An expired justification is a finding, not a formality."
            exit 1
          fi
          echo "heron_brook mitigation review due ${review_by} (today ${today}) — OK."

  # The `devenv test` runtime gate lives in its OWN workflow
  # (devenv-test.yml). Its job always reports because branch protection
  # requires that context, but it detects changed paths before checkout so only
  # PRs touching instruction-file materialization surfaces pay its cold-closure
  # cost. `nix flake check` (the test job above) remains THE validation
  # entrypoint.

  # gitleaks runs locally as a pre-commit hook (see devenv.nix). This
  # CI job is the safety net for the `--no-verify` path: even when
  # damage is already done, the alert tells us to rotate credentials.
  # Uses gitleaks from nixpkgs directly (no third-party action), via
  # `--inputs-from .` so it resolves from THIS flake's locked nixpkgs
  # and therefore really is the same binary the pre-commit hook runs
  # (`${pkgs.gitleaks}` in devenv.nix). The previous bare `nixpkgs#`
  # form read the rolling registry channel, which matched the pin only
  # by coincidence and would have drifted silently.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      # Scan every ref EXCEPT gh-pages. `fetch-depth: 0` pulls all
      # branches, and docs.yml force-pushes gh-pages as an ORPHAN
      # single commit (no parents) holding the generated mdBook/NuschtOS
      # per-PR previews under pr/<branch>/. Because it has no parent,
      # its entire tree (~154 MB / 4.5k files) reads as one enormous
      # diff on every run: measured 407 MB / 4m58s, which made this
      # job the critical path in 19 of 23 sampled runs.
      #
      # It also keeps growing: 92.7 MB / 2860 of those files are
      # previews for 20 already-deleted branches. docs.yml has a
      # `cleanup` job meant to prune them, but `delete` events run the
      # DEFAULT branch's copy of a workflow and docs.yml does not exist
      # on main, so that job has never fired. Fixing that shrinks this
      # scan further but is not required for correctness here.
      #
      # Excluding it leaves ~20 MB of real source history (measured
      # 2.9s locally; expect ~15s on a CI runner at its observed
      # 1.4 MB/s). Coverage is unaffected: the published site is
      # generated from source commits this scan still reads.
      #
      # `--exclude` is a glob filter on the following `--all`, so if the
      # ref is ever renamed this silently degrades to a full scan
      # (slow but still correct) rather than failing the security gate.
      - name: Run gitleaks
        run: |
          nix run --inputs-from . nixpkgs#gitleaks -- git \
            --log-opts="--exclude=refs/remotes/origin/gh-pages --all" \
            --verbose --redact .
