name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-hestia:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-agentic-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: kiro-cli|codeql-bundle-javascript
      - name: Publish patched Hestia before cache consumers start
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          package="$(nix build --no-link --print-out-paths .#.ciHestia.x86_64-linux)"
          "$package/bin/hestia" --version

  build-packages:
    name: packages (${{ matrix.system }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [0, 1, 2, 3, 4]
        system: [x86_64-linux, aarch64-darwin]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Native builds use all cores, one build at a time per runner. Parallelism
      # is between runners; release profiles (including fat LTO) stay unchanged.
      # NIX_CONFIG survives cachix-action's NIX_USER_CONF_FILES override.
      NIX_CONFIG: |
        max-jobs = 1
        cores = 0
      SHARD_COUNT: 5
      SHARD_INDEX: ${{ matrix.shard }}
      SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Multi-user installation is essential on macOS: clients of different
      # Nix versions must not contend for LocalStore's exclusive migration lock.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^max-jobs = 1
      # This action owns uploads. NFB's optional second Cachix daemon had
      # forced shutdowns on macOS; its duplicate uploader is unnecessary.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-agentic-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: kiro-cli|codeql-bundle-javascript
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: ${{ matrix.system }}
      - name: Plan native package shard
        id: plan
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix eval --json ".#.ciPackages.$SYSTEM" --apply builtins.attrNames > "$RUNNER_TEMP/packages.json"
          python3 dev/scripts/ci-packages.py plan "$RUNNER_TEMP/packages.json" \
            "$SHARD_INDEX" "$SHARD_COUNT" "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/select.nix"
          echo "packages=$(jq -c .packages "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.json"
      - name: Build package shard
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix run --inputs-from . nix-fast-build -- \
            --flake ".#.ciPackages.$SYSTEM" \
            --select "$(cat "$RUNNER_TEMP/select.nix")" \
            --eval-workers 1 --eval-max-memory-size 4096 --max-jobs 1 \
            --skip-cached --no-link \
            --result-file "$RUNNER_TEMP/results.json" --result-format json
          python3 dev/scripts/ci-packages.py verify "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/results.json"
          cp "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/receipt.json"
      # flake check runs on ubuntu only, so Darwin needs its own run of the
      # Semble drift check: semble-grammars ships a manifest per platform, and
      # this is what catches a Darwin wheel that drops a grammar. One shard is
      # enough. It runs before the receipt upload, so a failure fails the
      # required build context.
      - name: Check extracted Semble metadata
        if: matrix.system == 'aarch64-darwin' && matrix.shard == 0
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix build ".#.checks.$SYSTEM.semble-extracted" --no-link
      - name: Upload successful shard receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.system }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-results-${{ matrix.system }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/results.json
          if-no-files-found: warn
      - name: Diagnostic dump
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          ps -Ao pid,ppid,etime,command | command grep -E 'nix|cachix' | command grep -v grep || echo '(no matching processes)'
          nix --version || echo '(nix unavailable)'
          ls -d /nix/store/*-nix-eval-jobs-* 2>/dev/null || echo '(nix-eval-jobs not realized)'
          sudo -n lsof /nix/var/nix/db/big-lock || echo '(no lock holders reported or lsof unavailable)'
          nix config show || echo '(nix config show failed)'
  # Plan from the facts declarations consumed by owner drift checks. A failed
  # comparison runs every host-run owner, including when the base is missing.
  plan-extracted-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned: ${{ steps.plan.outputs.planned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Plan native extraction
        id: plan
        env:
          BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          python3 dev/scripts/ci-extracted-facts.py

  extracted-facts:
    needs: plan-extracted-facts
    if: >-
      needs.plan-extracted-facts.outputs.planned == 'true' &&
      needs.plan-extracted-facts.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        owner: ${{ fromJSON(needs.plan-extracted-facts.outputs.matrix) }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        max-jobs = 1
        cores = 2
      OWNER: ${{ matrix.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox = true
      - uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^sandbox = true
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: aarch64-darwin
      - name: Produce aarch64-darwin extracted facts
        id: produce
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix run ".#.checks.aarch64-darwin.${OWNER}-extracted.passthru.regenerate"
          if [ -n "$(git status --porcelain -- "packages/${OWNER}/extracted")" ]; then
            git status --porcelain -- "packages/${OWNER}/extracted"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # On the update bot's own branches the new raw is committed back AS the
      # bot. update-publish.sh only keeps touching a branch it owns: bot_owns
      # requires origin's head to be the bot's last push, non_bot_commits
      # requires every commit to be authored AND committed by the bot email,
      # and update-github.py `push` requires GitHub to credit the push to the
      # App. git-bot-identity gives the author/committer; the App token gives
      # the push credit. Either missing, the next sweep leaves the branch as a
      # human edit. Fork heads lack the secrets, so they take the artifact path.
      - name: Generate publishing App token
        id: app-token
        if: >-
          steps.produce.outputs.changed == 'true' && startsWith(github.head_ref,
          'update/') && github.event.pull_request.head.repo.full_name ==
          github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - if: steps.app-token.outcome == 'success'
        uses: ./.github/actions/git-bot-identity
        with:
          account: nix-agentic-tools-bot[bot]
          token: ${{ github.token }}

      # The checkout is the PR's merge ref; its merge commit is not the bot's,
      # so the raw is moved onto the branch head before committing. A plain
      # (non-force) push is rejected if the branch moved meanwhile. A push made
      # with the App token (unlike GITHUB_TOKEN) triggers CI on the new head,
      # and this workflow's concurrency group then cancels this run.
      - name: Commit aarch64-darwin extracted facts as the update bot
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          gh auth setup-git --hostname github.com
          git stash push --include-untracked -- "packages/${OWNER}/extracted"
          git fetch --no-tags origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          git stash pop
          git add -- "packages/${OWNER}/extracted"
          git commit -m "chore(${OWNER}): record aarch64-darwin extracted facts"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      # Anywhere else nothing may write the branch, so the measured raw leaves
      # as an artifact and the leg fails until someone commits it.
      - name: Upload aarch64-darwin extracted facts
        if: >-
          steps.produce.outputs.changed == 'true' && steps.app-token.outcome ==
          'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.owner }}-extracted-aarch64-darwin
          path: packages/${{ matrix.owner }}/extracted
          if-no-files-found: error

      - name: Fail on stale aarch64-darwin extracted facts
        if: >-
          steps.produce.outputs.changed == 'true' && steps.app-token.outcome ==
          'skipped'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          echo "::error::The committed aarch64-darwin extracted facts are stale." \
               "Artifact ${OWNER}-extracted-aarch64-darwin holds the measured files." \
               "From the repository root, run and commit:"
          echo "  gh run download ${RUN_ID} -n ${OWNER}-extracted-aarch64-darwin -D ${OWNER}-extracted-aarch64-darwin"
          git ls-files --modified --others --exclude-standard -- "packages/${OWNER}/extracted" |
            while IFS= read -r changed_file; do
              echo "  cp ${OWNER}-extracted-aarch64-darwin/${changed_file##*/} ${changed_file}"
            done
          exit 1

      - name: Check extracted facts
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix build ".#.checks.aarch64-darwin.${OWNER}-extracted" --no-link

  # Preserve the required contexts. A cancelled, skipped, or missing worker
  # must fail these checks, including failures after a receipt was uploaded.
  build:
    needs: [build-packages, extracted-facts, plan-extracted-facts]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful package workers
        env:
          EXTRACTED_RESULT: ${{ needs.extracted-facts.result }}
          EXTRACTED_MATRIX: ${{ needs.plan-extracted-facts.outputs.matrix }}
          PLAN_RESULT: ${{ needs.plan-extracted-facts.result }}
          PLANNED: ${{ needs.plan-extracted-facts.outputs.planned }}
          RESULT: ${{ needs.build-packages.result }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          test "$RESULT" = success
          test "$PLAN_RESULT" = success
          test "$PLANNED" = true
          if [ "$EXTRACTED_RESULT" = skipped ]; then
            test "$EXTRACTED_MATRIX" = '[]'
          else
            test "$EXTRACTED_RESULT" = success
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-${{ matrix.system }}-*
          path: receipts
      - name: Require complete native package coverage
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          python3 dev/scripts/ci-packages.py coverage receipts 5

  # The workflows unlock patches Kiro's proprietary binary. Validate that
  # patch on both supported systems without distributing the result through
  # our public Cachix cache. This job intentionally does not install
  # cachix-action, and the command overrides the flake's substituters so a
  # previously uploaded patched output cannot turn this into a cache-hit-only
  # test. Consumers who opt into the unlock apply the patch locally too.
  #
  # Named for what it ASSERTS, not where it runs. It was `kiro-workflows-local`
  # and that read as "runs on your machine" — it never did; "local" meant the
  # artifact stays local. Renaming it changes the status-check CONTEXT, so the
  # branch ruleset's required-checks list has to move with it.
  #
  # ALWAYS-REPORTING, deliberately: the JOB always runs and the expensive steps
  # are gated on `steps.scope.outputs.needed`. A required
  # check that is genuinely SKIPPED never reports a conclusion, and GitHub
  # blocks the PR forever waiting for it — so "make it required" and "skip it
  # when irrelevant" can only coexist in this shape.
  kiro-patched:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only inputs that can move `kiro-cli-rollout-canary`'s store path. A
      # context7-mcp bump touches another owner's recipe tree and cannot, so it
      # should not pay for a 621 MiB build on two runners.
      #
      # The raw Kiro recipe, release sidecar, and owner packaging helpers
      # determine the patched build. Shared facet assembly supplies the
      # active package set. HM/devenv module-only changes do not alter the
      # raw binary derivation.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          needed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            needed=false
            changed_files="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[].filename'
            )"

            while IFS= read -r changed_file; do
              case "$changed_file" in
                .github/actions/warm-ifd/* | \
                  .github/workflows/ci.yml | \
                  config/systems.nix | \
                  dev/scripts/assert-not-published.sh | \
                  flake.lock | \
                  flake.nix | \
                  lib/extracted/* | \
                  lib/facets.nix | \
                  lib/facets/* | \
                  packages/kiro-cli/checks.nix | \
                  packages/kiro-cli/checks/* | \
                  packages/kiro-cli/extract/* | \
                  packages/kiro-cli/extracted/* | \
                  packages/kiro-cli/lib/packaging.nix | \
                  packages/kiro-cli/packages/* | \
                  packages/kiro-cli/rollout-canary.nix | \
                  packages/kiro-cli/sources.json | \
                  lib/packaging.nix)
                  needed=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "patched Kiro validation needed: ${needed}"

      # Use the same multi-user installer as package shards. The old
      # single-user nix-quick-install setup deadlocked when clients of
      # different Nix versions requested LocalStore's migration lock while a
      # Cachix process held the store open. With the daemon-backed store,
      # clients do not take that lock themselves: retaining both Cachix
      # upload processes after the installer fix passed runs 31837837510 and
      # 34743961738. Uploader count alone was not the deadlock condition.
      # Kiro omits uploads to keep the patched artifact out of public caches.
      #
      # Its darwin builds had never run under a multi-user daemon before this
      # change, moving from `runner` to `_nixbld*`, which put the ad-hoc
      # codesign-then-exec assertion in lib/packaging.nix at risk on a required
      # check. That is now measured, not inferred: run 31837837510 built
      # the earlier workflows-patched Kiro locally under `_nixbld*` and passed.
      - if: steps.scope.outputs.needed == 'true'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox = true

      - if: steps.scope.outputs.needed == 'true'
        uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^sandbox = true

      # This only realizes the IFD sources used during evaluation. It has no
      # Cachix credentials and does not build the patched Kiro output; the
      # build below still removes the project cache from its substituters.
      - name: Warm IFD sources (retry, best-effort)
        if: steps.scope.outputs.needed == 'true'
        uses: ./.github/actions/warm-ifd
        with:
          systems: ${{ matrix.system }}

      # Flake check on ubuntu omits Darwin. Exercise extracted metadata and
      # packaged KAS patching, native resources, ACP and dispatch on both
      # Kiro-supported platforms here.
      - name: Check extracted metadata and packaged KAS
        if: steps.scope.outputs.needed == 'true'
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix build \
            ".#.checks.${{ matrix.system }}.kiro-cli-extracted" \
            ".#.checks.${{ matrix.system }}.kiro-bundle-patch-drift" \
            ".#.checks.${{ matrix.system }}.kiro-kas-dispatch" \
            ".#.checks.${{ matrix.system }}.kiro-kas-extraction" \
            --no-link

      - name: Build patched Kiro without the project cache
        id: build-patched
        if: steps.scope.outputs.needed == 'true'
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          out="$(nix build ".#.ciPackages.${{ matrix.system }}.kiro-cli-rollout-canary" \
            --no-link --print-out-paths \
            --option extra-substituters "" \
            --option substituters "https://cache.nixos.org https://devenv.cachix.org")"
          printf 'out=%s\n' "$out" >> "$GITHUB_OUTPUT"

      # TRIPWIRE. The exclusion above and the `pushFilter: kiro-cli` on every
      # credentialed cachix-action step are both configuration, and this repo
      # already learned that a mitigation with an unwatched hole reads exactly
      # like a working one: #665 excluded this attribute from the
      # cache-writing build and the patched binary was published anyway for
      # eleven days, through update.yml's whole-package-set verification build.
      # So assert the OUTCOME rather than trusting either knob — ask the cache
      # directly whether the patched closure is fetchable.
      #
      # This runs here because the job already has the paths and needs no
      # credentials (a narinfo GET is public), and because a `nix flake check`
      # derivation is sandboxed and cannot reach the network at all.
      - name: Assert the patched output is not published
        if: steps.scope.outputs.needed == 'true'
        env:
          OUT: ${{ steps.build-patched.outputs.out }}
          CACHE: https://nix-agentic-tools.cachix.org
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          # Process substitution would hide enumeration failure from errexit.
          closure_file="$RUNNER_TEMP/patched-closure"
          if ! nix path-info --recursive "$OUT" > "$closure_file"; then
            echo "::error::could not enumerate the patched closure" >&2
            exit 1
          fi
          if ! command grep -Fx -- "$OUT" "$closure_file" >/dev/null; then
            echo "::error::patched closure listing omitted its root output" >&2
            exit 1
          fi

          # Assert on the WHOLE patched closure: patched-unique paths and the
          # shared FHS pieces (dispatcher, `-init`, `-fhsenv-profile`) alike.
          # The shared pieces used to be subtracted because they were published
          # before the pushFilter existed; the operator purged them, so nothing
          # kiro may answer 200 any more. Select on BASENAMES (`${path##*/}`):
          # `nix path-info` output shape has varied between nix versions, and
          # the store hash plus name identifies a path either way.
          kiro_file="$RUNNER_TEMP/patched-kiro-paths"
          while read -r path; do
            case "${path##*/}" in *kiro*) printf '%s\n' "$path" ;; esac
          done < "$closure_file" > "$kiro_file"
          mapfile -t paths < "$kiro_file"

          # The shared HTTP assertion: a positive control against the cache
          # first, then only a 404 counts as absent. It refuses an empty path
          # list, so a well-formed listing with no kiro path in it fails rather
          # than asking nothing and passing.
          dev/scripts/assert-not-published.sh "${paths[@]}"

  # Validation entrypoint: `nix flake check` is the single source of truth for
  # repo health. In addition to structural evaluation and formatting, it runs
  # the cspell/deadnix/statix all-files projection and the specialized
  # shellcheck corpus gate derived from config/repo-validation.nix. Local hooks
  # provide earlier feedback; CI is the authority that covers --no-verify and
  # pre-existing corpus drift.
  test:
    needs: publish-hestia
    if: >-
      always() && (needs.publish-hestia.result == 'success' ||
       needs.publish-hestia.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Forks consume accessible caches without requiring cache writes.
      HESTIA_READ_ONLY:
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test CI workflow gates
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          python3 dev/scripts/test-ci-packages.py
          python3 dev/scripts/test-ci-cache.py
          python3 dev/scripts/test-update-matrix.py
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox = true

      - uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^sandbox = true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-agentic-tools

      - name: Install CI-only check cache
        uses: ./.github/actions/check-cache
        with:
          read-only: ${{ env.HESTIA_READ_ONLY }}

      # Warm the flake eval cache BEFORE the check. Same IFD-fetch flake as
      # the build job: overlays read fetchFromGitHub sources at eval time,
      # and a transient fetch blip fails the whole job. Best-effort: flake
      # check still gets its own eval if warm fails.
      #
      # `systems` names BOTH, but do NOT read that as darwin coverage.
      # Plain `nix flake check` reports "The check omitted these
      # incompatible systems: aarch64-darwin", and the step below does not
      # pass `--all-systems`, so this job evaluates x86_64-linux ONLY. The
      # repo's darwin coverage is the required aarch64-darwin leg of the
      # build job above — there is no darwin evaluation here to warm for.
      # The darwin entry is kept anyway because IFD source fetches are
      # system-agnostic and content-addressed, so it costs almost nothing
      # and stays correct if `--all-systems` is ever adopted.
      #
      # Adopting it is NOT a one-word change, and measuring that was the
      # point of writing this down. `--all-systems` only EVALUATES the
      # foreign system (it never builds it — verified on a throwaway
      # two-system flake), so the cost would be evaluation alone: roughly
      # +43s and a ~7.8 GB RSS ceiling, against a 36s / 6.2 GB linux
      # baseline. But instantiating the darwin checks on a linux host
      # currently FAILS outright: IFD on stacked-workflows-skills.drv, which
      # must be BUILT for aarch64-darwin; a linux runner cannot build it at
      # all. So `--all-systems` would turn this required check red today.
      # Fix that first; the flag is not the starting point.
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: x86_64-linux aarch64-darwin

      # TRIPWIRE for the CodeQL bundle (lib/extracted/codeql), the outcome
      # assertion the kiro-patched job makes for the patched Kiro: the GitHub
      # CodeQL Terms forbid distributing the CLI, and the pushFilter and
      # ci-packages.py's EXCLUDED are only configuration. Every codeql-bundle
      # output in the prototype check's build closure must answer 404. It
      # evaluates and builds nothing, so it runs on every event, forks too.
      - name: Assert the CodeQL bundle is not published
        env:
          CACHE: https://nix-agentic-tools.cachix.org
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          drv="$(nix eval --raw .#.checks.x86_64-linux.kimchi-codeql-network-targets.drvPath)"
          nix-store --query --requisites "$drv" > "$RUNNER_TEMP/codeql-requisites"
          mapfile -t drvs < <(command grep -E -- '-codeql-bundle-[^/]*\.drv$' "$RUNNER_TEMP/codeql-requisites" || :)
          # Fail closed: the bundle and its source tarball are two
          # derivations, so fewer means the listing no longer describes them.
          if [ "${#drvs[@]}" -lt 2 ]; then
            echo "::error::expected the bundle and its source among the check's derivations, found ${#drvs[@]}" >&2
            exit 1
          fi
          nix-store --query --outputs "${drvs[@]}" > "$RUNNER_TEMP/codeql-paths"
          mapfile -t paths < "$RUNNER_TEMP/codeql-paths"
          dev/scripts/assert-not-published.sh "${paths[@]}"

      # The Semble customization smoke check builds a patched Semble here,
      # parses real AWK and jq samples, and exercises path-mapped discovery.
      # Customization still produces a separate patched build; this job's
      # Cachix client is read-only. The base package is built and published
      # by the authenticated package matrix above.
      # Same-repository runs do not evaluate here. The required `checks-matrix`
      # gate below instantiates every check once, with import-from-derivation,
      # and builds each ownership group on its own runner; the package shards
      # evaluate and build every package; the module checks import every
      # module. The only output no gate evaluates is `devShells.ci`, a four
      # package mkShell for the update pipeline. Neither no-build form works
      # as a substitute: `nix flake check --no-build` cannot copy a fixture
      # path a check reads back ("path … is not valid"), and
      # `nix flake show` disables import-from-derivation outright. Fork PRs
      # skip the matrix (read-only Hestia), so they keep the single full check.
      - name: Run full flake checks (fork)
        if: ${{ env.HESTIA_READ_ONLY == 'true' }}
        run: nix flake check

      # ~90-day reminder to re-check that the delegate-routing per-turn reminder
      # still satisfies the heron_brook clamp's escape clause.
      # A CALENDAR, not a gate on content:
      # it fires only past `reviewBy`, and only on the claude-code update PR.
      # The sweep opens one of those several times a week, so the reminder
      # surfaces within days of the date passing while never touching any other
      # PR. `head_ref` is empty on push events, so non-PR runs skip for free.
      #
      # It cannot live in a Nix check: reading the current date inside a
      # derivation is impure and would be cached. It is a STEP in `test` rather
      # than its own job so it needs no new required-context string that a job
      # rename could silently break — the same reasoning
      # checks/instructions/instructions-drift.nix records for living in `nix flake check`.
      #
      # The branch name below is generated as `update/<key>` from
      # config.update.targets. packages/claude-code/checks/claude-heron-brook.nix reads that name
      # back out of THIS file and fails if the key is renamed out from under it,
      # so this gate cannot silently stop matching.
      #
      # TO DISCHARGE — build the binary and grep it. The positive control is NOT
      # optional; a clean negative from an unverified grep on a ~275 MB binary
      # proves nothing:
      #   B=$(nix build --no-link --print-out-paths .#.ciPackages.x86_64-linux.claude-code)/bin/claude
      #   grep -ac 'NotebookEdit' "$B"                            # control, must be >0
      #   grep -ac 'or a skill asks for it' "$B"
      #                                                           # 0 => clause changed or fixed
      #   grep -ac 'tengu_heron_brook' "$B"                       # the gate
      # Presence is the signal, never the count: grep counts LINES and the
      # bundle is minified, so counts drift with no behavior change.
      #
      # If the clamp remains, verify that the delegate-routing per-turn reminder
      # still satisfies its "unless the user, a CLAUDE.md file, or a skill asks for it" escape clause.
      # Then EITHER bump `reviewBy` ~90 days, OR — if upstream fixed it — drop the
      # permission grant from the delegate-routing reminder's default text, and
      # delete this step and packages/claude-code/checks/claude-heron-brook.nix.
      - name: Heron-brook mitigation review tripwire
        if: github.head_ref == 'update/claude-code'
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          tripwire=config/heron-brook-tripwire.json
          review_by="$(jq -r .reviewBy "$tripwire")"
          issue="$(jq -r .issue "$tripwire")"
          today="$(date -u +%F)"
          # Lexicographic compare is correct for ISO-8601 dates.
          if [[ "$today" > "$review_by" ]]; then
            echo "::error file=${tripwire}::heron_brook mitigation is past its ${review_by} review date (today ${today}). Re-check whether Claude Code still ships the delegation clamp — the grep procedure is in the comment above this step, and ${issue} tracks it upstream. Verify that the delegate-routing per-turn reminder still satisfies the clamp's escape clause. Then EITHER bump reviewBy in ${tripwire}, OR, if upstream fixed it, drop the permission grant from the delegate-routing per-turn reminder and delete this step and packages/claude-code/checks/claude-heron-brook.nix. An expired justification is a finding, not a formality."
            exit 1
          fi
          echo "heron_brook mitigation review due ${review_by} (today ${today}) — OK."

  # The check gate. `checks-matrix` is a required context; `test` above only
  # evaluates. These three jobs evaluate the Linux checks ONCE with Hestia's
  # matrix subaction, then build each uncached ownership group
  # (`meta.hestia.group` in `ciChecks`) by drv path, with no flake evaluation
  # in the workers.
  #
  # The evaluator is nix-eval-jobs with its worker garbage collector
  # re-enabled (dev/ci-check-evaluator.nix). Stock nix-eval-jobs sets
  # GC_DONT_GC and runs out of memory on this check set; with the collector on,
  # one worker evaluated all 1051 checks in ~9 GB.
  #
  # Fork PRs skip it: a read-only Hestia cannot register the drv closures the
  # workers substitute, so there is nothing to build by drv path.
  checks-eval:
    needs: publish-hestia
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-with-check-cache
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: x86_64-linux

      # Hestia reads nix-eval-jobs' stdout itself and emits only uncached
      # rows, each naming its first member's attr. The wrapper keeps every raw
      # row of the SAME evaluation for the coverage check below.
      - name: Build the check evaluator
        id: evaluator
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          evaluator="$(nix build --no-link --print-out-paths .#.ciCheckEvaluator.x86_64-linux)"
          capture="$RUNNER_TEMP/capture-check-rows"
          cat > "$capture" <<'EOF'
          #!/usr/bin/env bash
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          status=0
          "$@" > "$CHECK_ROWS" || status=$?
          cat "$CHECK_ROWS"
          exit "$status"
          EOF
          chmod +x "$capture"
          echo "CHECK_ROWS=$RUNNER_TEMP/rows.jsonl" >> "$GITHUB_ENV"
          echo "command=$capture $evaluator/bin/nix-eval-jobs --workers 1 --max-memory-size 12288" >> "$GITHUB_OUTPUT"

      # `.#.` selects the attr path exactly; nix-eval-jobs resolves the
      # fragment like `nix build`, so the rows' attrs are bare check names.
      - name: Evaluate Linux checks once and plan uncached groups
        id: matrix
        uses: Mic92/hestia/matrix@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          flake: .#.ciChecks.x86_64-linux
          nix-eval-jobs: ${{ steps.evaluator.outputs.command }}
          runner-map: x86_64-linux=ubuntu-latest

      # The evaluated attrs must be exactly the public checks less the
      # `ciUnpublishedChecks`, which `checks-unpublished` builds, and every
      # uncached derivation must be in exactly one row. The second evaluation
      # runs after the matrix evaluator exited. The matrix goes through a
      # quoted heredoc, not `env:`: a cold plan nears Linux's 128 KiB limit on
      # one environment string.
      - name: Verify the plan covers every public check
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          cat > "$RUNNER_TEMP/matrix.json" <<'JSON'
          ${{ steps.matrix.outputs.matrix }}
          JSON
          NIX_SHOW_STATS=1 NIX_SHOW_STATS_PATH="$RUNNER_TEMP/checks-eval-stats.json" \
            nix eval --no-eval-cache --json .#.checks.x86_64-linux --apply builtins.attrNames > "$RUNNER_TEMP/checks.json"
          nix eval --json .#.ciUnpublishedChecks.x86_64-linux > "$RUNNER_TEMP/unpublished.json"
          jq -n \
            --slurpfile rows "$CHECK_ROWS" \
            --slurpfile names "$RUNNER_TEMP/checks.json" \
            --slurpfile unpublished "$RUNNER_TEMP/unpublished.json" \
            --slurpfile matrix "$RUNNER_TEMP/matrix.json" '
            (($names[0] - $unpublished[0]) | sort) as $public
            | $matrix[0].include as $include
            | [$include[].installables | split(" ")[] | select(. != "")] as $installables
            | ($installables | map(rtrimstr("^*"))) as $planned
            | ([$rows[] | select(.isCached == false) | .drvPath] | unique) as $pending
            | {
                checks: ($public | length),
                evaluated: ($rows | length),
                cached: ([$rows[] | select(.isCached == true)] | length),
                rows: ($include | length),
                planned: ($planned | length),
                failures: [
                  ($rows[]
                    | select((.attrPath | length) != 1 or .system != "x86_64-linux")
                    | "malformed row \(.attr)"),
                  (if ([$rows[].attrPath[0]] | sort) != $public
                    then "evaluated attrs differ from the public checks less the unpublished ones" else empty end),
                  (if ($planned | sort) != $pending
                    then "planned derivations differ from the uncached derivations" else empty end)
                ]
              }' > "$RUNNER_TEMP/plan-report.json"
          jq -r '"| \(keys_unsorted[:-1] | join(" | ")) |",
            "|\(keys_unsorted[:-1] | map(" --- ") | join("|"))|",
            "| \([.[]][:-1] | map(tostring) | join(" | ")) |"' \
            "$RUNNER_TEMP/plan-report.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.failures | length > 0' "$RUNNER_TEMP/plan-report.json" > /dev/null; then
            jq -r '.failures[] | "::error::\(.)"' "$RUNNER_TEMP/plan-report.json"
            exit 1
          fi

      # Function-call count of the names evaluation above, against a fixed
      # ceiling; the action's description carries the measurements.
      - name: Check the Linux name evaluation stays within budget
        uses: ./.github/actions/check-eval-budget
        with:
          label: x86_64-linux check names
          stats: ${{ runner.temp }}/checks-eval-stats.json
      - name: Upload check plan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-plan
          path: |
            ${{ runner.temp }}/checks-eval-stats.json
            ${{ runner.temp }}/checks.json
            ${{ runner.temp }}/matrix.json
            ${{ runner.temp }}/plan-report.json
            ${{ runner.temp }}/rows.jsonl
            ${{ runner.temp }}/unpublished.json
          if-no-files-found: warn

  checks-build:
    name: checks (${{ matrix.name }})
    needs: checks-eval
    if: needs.checks-eval.outputs.any-jobs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks-eval.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      INSTALLABLES: ${{ matrix.installables }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-with-check-cache
        with:
          wait-manifest-version:
            ${{ needs.checks-eval.outputs.manifest-version }}
      # The upstream filter omits public references from the drv closures, so
      # prefetch prepares them before importing the Hestia-backed part.
      - name: Build evaluated derivations without flake evaluation
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          read -r -a installables <<< "$INSTALLABLES"
          "$HESTIA_BIN" prefetch "${installables[@]}"
          nix build --no-link -L "${installables[@]}"

  # The checks named in `unpublishedChecks` (lib/testing/check-options.nix),
  # whose build closures may reach no cache. Today that is the CodeQL check:
  # the GitHub CodeQL Terms forbid sharing, publishing or distributing the CLI.
  # A Hestia worker would upload the bundle with the rest of what it builds
  # (PR #2771's first run did, through `codeql-bundle-javascript (post)`), and
  # Hestia v3.1.0 has no path exclusion, only read-only mode. So this job
  # installs no Hestia and holds no Cachix token, like `kiro-patched`:
  # substitutes come from the flake's own read-only caches and nothing is
  # written anywhere. The `test` job's tripwire still asserts the public cache
  # does not serve the bundle. It always runs, forks included, since it needs
  # no secret; `checks-matrix` requires it, so the checks stay gated.
  checks-unpublished:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox = true
      - uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^sandbox = true
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: x86_64-linux
      # Fails closed on an empty list: a job that builds nothing would pass
      # and hide that the checks it exists for went elsewhere.
      - name: Build the unpublished checks
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix eval --json .#.ciUnpublishedChecks.x86_64-linux > "$RUNNER_TEMP/unpublished.json"
          jq -r '.[] | ".#.checks.x86_64-linux.\(.)"' "$RUNNER_TEMP/unpublished.json" > "$RUNNER_TEMP/unpublished"
          mapfile -t installables < "$RUNNER_TEMP/unpublished"
          if [ "${#installables[@]}" -eq 0 ]; then
            echo "::error::ciUnpublishedChecks is empty, so this job would build nothing; delete it instead" >&2
            exit 1
          fi
          nix build --no-link -L "${installables[@]}"

  # Fails unless evaluation succeeded and every planned leg succeeded: the
  # matrix is fixed by checks-eval and does not fail fast. An all-cached plan
  # has no workers and passes. The unpublished checks must pass as well.
  # Required context. A fork PR has no evaluator run, so its `test` job built
  # every check itself and this gate passes on that job's success instead.
  checks-matrix:
    needs: [checks-eval, checks-build, checks-unpublished, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful evaluation and workers
        env:
          ANY_JOBS: ${{ needs.checks-eval.outputs.any-jobs }}
          BUILD_RESULT: ${{ needs.checks-build.result }}
          EVAL_RESULT: ${{ needs.checks-eval.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UNPUBLISHED_RESULT: ${{ needs.checks-unpublished.result }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          test "$UNPUBLISHED_RESULT" = success
          if [ "$EVAL_RESULT" = skipped ]; then
            test "$TEST_RESULT" = success
            exit 0
          fi
          test "$EVAL_RESULT" = success
          case "$ANY_JOBS" in
            false) test "$BUILD_RESULT" = skipped ;;
            true) test "$BUILD_RESULT" = success ;;
            *) exit 1 ;;
          esac

  # The full `devenv test` smoke suite and #821 telemetry remain available as
  # the manual Devenv Diagnostic workflow. Its extracted deterministic
  # contracts live in the flake checks above, so no automatic PR or push path
  # pulls the interactive shell closure.

  # Explicit Darwin evaluation keeps coverage now that check values are lazy:
  # names and every drvPath both gate this job, a required context since
  # 2026-10-18 (nothing else forces every Darwin check value any more).
  # First run, 2026-10-18 on macos-latest: 997 names in 51 s at 1984 MiB;
  # forcing every drvPath reached 2928 MiB in 161 s and then failed on the
  # Linux-only module-glab-keyring-sync-hm-wiring. A second run reached 3064 MiB.
  # Linux names were 1011 at 35 s / 3.7 GB on a Linux host the same day.
  # Waiting for package shards keeps this job from taking a macOS runner slot
  # ahead of the package shards (5 concurrent on this plan).
  checks-eval-darwin:
    needs: build-packages
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The IFD builds this evaluation triggers run in the daemon on the same
      # 7 GB; keep them to one job on two cores, as extracted-facts does.
      NIX_CONFIG: |
        max-jobs = 1
        cores = 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^max-jobs = 1
      - name: Warm IFD sources (retry, best-effort)
        uses: ./.github/actions/warm-ifd
        with:
          systems: aarch64-darwin
      # BSD time on macOS reports maximum resident set size in BYTES and writes
      # its report to stderr, so nix's own stderr lands in the same .time file.
      - name: Evaluate aarch64-darwin check names
        env:
          NIX_SHOW_STATS: "1"
          NIX_SHOW_STATS_PATH: ${{ runner.temp }}/darwin-check-names.stats.json
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          status=0
          /usr/bin/time -l nix eval --no-eval-cache --json .#.checks.aarch64-darwin --apply builtins.attrNames \
            > "$RUNNER_TEMP/darwin-check-names.json" 2> "$RUNNER_TEMP/darwin-check-names.time" || status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 "$RUNNER_TEMP/darwin-check-names.time" >&2
            exit "$status"
          fi
          count="$(jq length "$RUNNER_TEMP/darwin-check-names.json")"
          rss="$(awk '/maximum resident set size/ {printf "%.1f", $1 / 1048576}' "$RUNNER_TEMP/darwin-check-names.time")"
          wall="$(awk '/ real / {print $1}' "$RUNNER_TEMP/darwin-check-names.time")"
          printf '| Darwin check names | Value |\n| --- | --- |\n| Count | %s |\n| Peak RSS (MiB) | %s |\n| Wall time (s) | %s |\n' \
            "$count" "$rss" "$wall" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the Darwin name evaluation stays within budget
        uses: ./.github/actions/check-eval-budget
        with:
          label: aarch64-darwin check names
          stats: ${{ runner.temp }}/darwin-check-names.stats.json
      # Force every drvPath as a hard failure: a Linux-only check leaking into
      # Darwin fails this job when its evaluation fails there; one that only
      # fails when built is not caught here. macOS swaps rather than killing an
      # oversized evaluator, so bound this step to 25 minutes as well as the job
      # timeout.
      - name: Force every aarch64-darwin check derivation
        timeout-minutes: 25
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          status=0
          /usr/bin/time -l nix eval --json .#.checks.aarch64-darwin \
            --apply 'checks: builtins.mapAttrs (_: check: check.drvPath) checks' \
            > "$RUNNER_TEMP/darwin-check-drvs.json" 2> "$RUNNER_TEMP/darwin-check-drvs.time" || status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 "$RUNNER_TEMP/darwin-check-drvs.time" >&2
            exit "$status"
          fi
          count="$(jq 'keys | length' "$RUNNER_TEMP/darwin-check-drvs.json")"
          rss="$(awk '/maximum resident set size/ {printf "%.1f", $1 / 1048576}' "$RUNNER_TEMP/darwin-check-drvs.time")"
          wall="$(awk '/ real / {print $1}' "$RUNNER_TEMP/darwin-check-drvs.time")"
          printf '\n| Darwin check drvPaths | Value |\n| --- | --- |\n| Count | %s |\n| Peak RSS (MiB) | %s |\n| Wall time (s) | %s |\n' \
            "$count" "$rss" "$wall" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload aarch64-darwin check evaluation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-eval-aarch64-darwin
          path: |
            ${{ runner.temp }}/darwin-check-drvs.json
            ${{ runner.temp }}/darwin-check-names.json
            ${{ runner.temp }}/darwin-check-names.stats.json
            ${{ runner.temp }}/darwin-check-drvs.time
            ${{ runner.temp }}/darwin-check-names.time
          if-no-files-found: warn

  # `ai.jail` run for real (checks/ai-jail/live.nix), nothing excluded: a
  # jailed probe's fresh /proc must list only the jail's own processes, and the
  # same probe outside must list the runner's. bubblewrap cannot run inside the
  # Nix build sandbox here, so the check only builds the script and this job
  # runs it on the runner. A jail-nix bump that stops the launcher from jailing
  # fails here.
  jail-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Run the live jail smoke test
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          # Ubuntu's AppArmor denies unprivileged user namespaces to binaries
          # without a profile, such as the Nix store's bwrap the jail runs.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          nix run .#.checks.x86_64-linux.ai-jail-live

  # One NixOS VM boot that activates real Home Manager generations with real
  # sops-nix and ai.services units, then checks the order the daemons start and
  # restart in against the secrets they read. The test is a dev-only fixture
  # flake with its own lock, so the root flake.lock consumers follow never
  # gains home-manager or sops-nix. Each case logs `CASE <name>: PASS|FAIL`.
  #
  # GitHub's Linux runners expose /dev/kvm to root only; the udev rule opens it
  # to the Nix build users before the daemon starts, and `system-features`
  # names `kvm` and `nixos-test`, which the test derivation requires.
  # Read-only Cachix: the runner holds no token, so nothing is pushed.
  service-secret-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open /dev/kvm to the Nix build users
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm-nix-build.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the event; wait for the rule to apply.
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
            system-features = benchmark big-parallel kvm nixos-test
      - uses: ./.github/actions/assert-nix-config
        with:
          require: |
            ^accept-flake-config = true
            ^system-features = .*[[:space:]]kvm([[:space:]]|$)
            ^system-features = .*[[:space:]]nixos-test([[:space:]]|$)
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-agentic-tools
      - name: Run the VM test
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix build --no-link -L \
            ./checks/service-secret-ordering#checks.x86_64-linux.service-secret-ordering

  # gitleaks runs locally as a pre-commit hook (see devenv.nix). This
  # CI job is the safety net for the `--no-verify` path: even when
  # damage is already done, the alert tells us to rotate credentials.
  # Uses gitleaks from nixpkgs directly (no third-party action), via
  # `--inputs-from .` so it resolves from THIS flake's locked nixpkgs
  # and therefore really is the same binary the pre-commit hook runs
  # (`${pkgs.gitleaks}` in devenv.nix). The previous bare `nixpkgs#`
  # form read the rolling registry channel, which matched the pin only
  # by coincidence and would have drifted silently.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true
      # Scan every ref EXCEPT gh-pages. `fetch-depth: 0` pulls all
      # branches, and docs.yml force-pushes gh-pages as an ORPHAN
      # single commit (no parents) holding the generated mdBook/NuschtOS
      # per-PR previews under pr/<branch>/. Because it has no parent,
      # its entire tree (~154 MB / 4.5k files) reads as one enormous
      # diff on every run: measured 407 MB / 4m58s, which made this
      # job the critical path in 19 of 23 sampled runs.
      #
      # It also keeps growing: 92.7 MB / 2860 of those files are
      # previews for 20 already-deleted branches. docs.yml has a
      # `cleanup` job meant to prune them, but `delete` events run the
      # DEFAULT branch's copy of a workflow and docs.yml does not exist
      # on main, so that job has never fired. Fixing that shrinks this
      # scan further but is not required for correctness here.
      #
      # Excluding it leaves ~20 MB of real source history (measured
      # 2.9s locally; expect ~15s on a CI runner at its observed
      # 1.4 MB/s). Coverage is unaffected: the published site is
      # generated from source commits this scan still reads.
      #
      # `--exclude` is a glob filter on the following `--all`, so if the
      # ref is ever renamed this silently degrades to a full scan
      # (slow but still correct) rather than failing the security gate.
      - name: Run gitleaks
        run: |
          nix run --inputs-from . nixpkgs#gitleaks -- git \
            --log-opts="--exclude=refs/remotes/origin/gh-pages --all" \
            --verbose --redact .
