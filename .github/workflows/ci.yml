name: CI

on:
  push:
    branches: [main, refactor/ai-factory-architecture]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# TODO: remove once DeterminateSystems/nix-installer-action ships node24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: nix-agentic-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # cachix-action pushes built paths automatically when
          # authToken is set and the push target matches

      - name: Install nix-fast-build
        run: nix profile add nixpkgs#nix-fast-build

      # Warm the flake eval cache BEFORE the build. Our overlays use IFD
      # (builtins.readFile on fetchFromGitHub) to compute versions at eval
      # time; fresh runners haven't realized these sources, so the build's
      # own eval would fetch them and a transient network blip ("HTTP2
      # framing layer") fails the whole job. Pre-realize the sources here,
      # retried with backoff. Best-effort: if all attempts fail we warn and
      # continue — the build step still gets its own eval attempt. Mirrors
      # update.yml's "Warm flake eval" step (same --apply expression).
      - name: Warm IFD sources (retry, best-effort)
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          warm() {
            nix eval --json \
              --option allow-import-from-derivation true \
              --apply 'pkgs: builtins.mapAttrs (n: p: p.version or p.name or "unknown") pkgs' \
              ".#packages.${{ matrix.system }}" >/dev/null
          }

          for attempt in 1 2 3; do
            if warm; then
              echo "IFD warm succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "IFD warm attempt ${attempt} failed"
            if [ "${attempt}" -lt 3 ]; then
              backoff=$((attempt * 15))
              echo "Retrying in ${backoff}s..."
              sleep "${backoff}"
            fi
          done

          echo "::warning::IFD warm failed after 3 attempts; build step will retry its own eval"

      - name: Build all packages
        run: |
          nix-fast-build \
            --flake ".#packages.${{ matrix.system }}" \
            --skip-cached \
            --cachix-cache nix-agentic-tools \
            --no-link

  # Validation entrypoint: `nix flake check` is the single source of
  # truth for repo health (structural eval checks + formatting hard
  # gate via checks.<system>.formatting). Pre-commit hooks remain a
  # local-only fast subset; see devenv.nix's git-hooks.hooks comment
  # block for the architecture rationale.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: nix-agentic-tools

      # Warm the flake eval cache BEFORE the check. Same IFD-fetch flake as
      # the build job (see its warm step): overlays read fetchFromGitHub
      # sources at eval time to compute versions, and a transient network
      # blip during that fetch fails the whole job. Unlike the build job,
      # `nix flake check` evaluates ALL systems on one runner, so warm both
      # x86_64-linux and aarch64-darwin here — IFD source fetches are
      # system-agnostic, so cross-system eval on a linux runner is fine.
      # Retried with backoff per system; best-effort (warn + continue) so we
      # never introduce a new hard failure — flake check still evaluates.
      - name: Warm IFD sources (retry, best-effort)
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          warm() {
            nix eval --json \
              --option allow-import-from-derivation true \
              --apply 'pkgs: builtins.mapAttrs (n: p: p.version or p.name or "unknown") pkgs' \
              ".#packages.$1" >/dev/null
          }

          warm_system() {
            local system=$1
            for attempt in 1 2 3; do
              if warm "${system}"; then
                echo "IFD warm (${system}) succeeded on attempt ${attempt}"
                return 0
              fi
              echo "IFD warm (${system}) attempt ${attempt} failed"
              if [ "${attempt}" -lt 3 ]; then
                backoff=$((attempt * 15))
                echo "Retrying in ${backoff}s..."
                sleep "${backoff}"
              fi
            done
            echo "::warning::IFD warm (${system}) failed after 3 attempts; flake check will retry its own eval"
          }

          for system in x86_64-linux aarch64-darwin; do
            warm_system "${system}"
          done

      - name: Run flake checks
        run: nix flake check

  # gitleaks runs locally as a pre-commit hook (see devenv.nix). This
  # CI job is the safety net for the `--no-verify` path: even when
  # damage is already done, the alert tells us to rotate credentials.
  # Uses gitleaks from nixpkgs directly (no third-party action) to
  # match the exact binary used in the pre-commit hook.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Run gitleaks
        run: nix run nixpkgs#gitleaks -- detect --source . --verbose --redact
