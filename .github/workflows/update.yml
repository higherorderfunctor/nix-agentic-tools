# CI pipeline v4: Renovate-style per-dependency PRs.
#
# Runs the ninja update pipeline. Each target leaves its commits on
# a per-dependency worktree branch (update/<name>); the PR-creation
# step pushes those branches and opens one PR per updated dependency.
#
# ci.yml validates PRs on both platforms (linux + darwin).
# PRs that pass both can be merged.
#
# Uses a GitHub App token so PRs trigger ci.yml's pull_request event.
name: Update

on:
  schedule:
    # Nightly dependency sweep (was: push to the old integration branch).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BRANCH_NAME: main

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Vestigial guard from the old push trigger. Under schedule the actor
    # is never the bot, so the first clause runs it; workflow_dispatch runs
    # it via the second clause regardless of actor. Effectively always true.
    if: >-
      github.actor != 'nix-agentic-tools-bot[bot]'
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: nix-agentic-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Resolves the bot's numeric user ID at run time rather than
      # hardcoding it, same as docs.yml. The previous address omitted the
      # ID entirely, so GitHub had nothing to match these commits against
      # — the "<id>+<login>" form is what attributes them to the bot
      # account, which is also the login the stale-PR step's allowlist
      # checks via .commits[].authors[].
      - uses: ./.github/actions/git-bot-identity
        with:
          account: nix-agentic-tools-bot[bot]
          token: ${{ secrets.GITHUB_TOKEN }}

      # `--inputs-from .` resolves against THIS flake's locked nixpkgs.
      # The bare `nixpkgs#` form read the rolling registry channel,
      # pulling in a second, unpinned nixpkgs and unpacking the
      # nixpkgs-unstable channel tarball before the pipeline's own eval.
      # jq is not installed at all: ubuntu-latest ships 1.7.1.
      - name: Install pipeline tools
        run: |
          nix profile add --inputs-from . nixpkgs#ninja
          nix profile add --inputs-from . nixpkgs#devenv
          nix profile add ".#formatter.x86_64-linux"

      # Record base commit before the pipeline runs.
      # Used to identify which worktree branches have actual updates.
      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Warm the flake eval cache BEFORE the ninja pipeline. Our overlays
      # use IFD (builtins.readFile on fetchFromGitHub) to compute versions
      # at eval time; nix-update (which runs nix-instantiate) crashes on
      # cold runners if those sources aren't realized first. This is the
      # shared warm-ifd composite (also used by ci.yml's build + test jobs).
      # Unlike CI, the pipeline cannot proceed without warm sources, so
      # retries: "1" + best-effort: "false" keep the original single-shot,
      # fail-hard behavior. Cachix daemon pushes the fetched sources.
      - name: Warm IFD sources (single-shot, fail-hard)
        uses: ./.github/actions/warm-ifd
        with:
          best-effort: "false"
          retries: "1"
          systems: x86_64-linux

      # Run ninja pipeline:
      # - Each target creates a worktree branch (update/<name>)
      # - Branches are pushed and PRs created after ninja completes
      - name: Run ninja update pipeline
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          mkdir -p "$RUNNER_TEMP"
          export WORKTREE_LOCK="$RUNNER_TEMP/nix-update-worktree"
          nix run .#generate-update-ninja
          ninja -j4 -v -k0 -f .update.ninja update-report
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Per-job worktree root, OUTSIDE $GITHUB_WORKSPACE (the flake root)
          # so devenv/Nix doesn't scan it, and under $RUNNER_TEMP (per-job,
          # auto-cleaned) so concurrent runs on a self-hosted runner can't
          # collide on a shared /tmp path.
          NAT_UPDATE_WORKTREES_DIR: ${{ runner.temp }}/nat-update-worktrees
          NIX_PATH: nixpkgs=flake:nixpkgs

      # Push worktree branches and create/update PRs.
      # Each update/<name> branch with commits gets a PR.
      # Records every touched branch in $RUNNER_TEMP/touched-branches
      # so the next step can identify untouched (stale) PRs. Writes a
      # ninja-completed.flag sentinel only if the loop completes
      # cleanly — the close step refuses to act without it.
      - name: Create per-dependency PRs
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          base_head="${{ steps.base.outputs.sha }}"
          : >"$RUNNER_TEMP/touched-branches"

          # Read back the identity git-bot-identity configured above; the
          # human-commit guard below compares every remote commit's author
          # against it. Assert it is non-empty rather than let it degrade:
          # an empty value makes EVERY commit look human, which would
          # silently stop the pipeline pushing anything at all.
          bot_email=$(git config user.email)
          if [ -z "$bot_email" ]; then
            echo "::error::git user.email is unset — the human-commit guard cannot run"
            exit 1
          fi

          # Find all update/* branches with commits ahead of base
          git branch --list 'update/*' | while read -r branch; do
            branch=$(echo "$branch" | tr -d ' *+')
            wt_head=$(git rev-parse "$branch")

            if [ "$wt_head" = "$base_head" ]; then
              echo "Skipping $branch (no changes)"
              continue
            fi

            subject=$(git log "$base_head".."$branch" --format='%s' | head -1)

            # Look up the existing PR once: its number and its
            # mergeability both feed the push decision below.
            pr_json=$(gh pr list --base "$BRANCH_NAME" --head "$branch" \
              --json number,mergeable --jq '.[0] // empty' 2>/dev/null || true)
            existing_pr=$(printf '%s' "$pr_json" | jq -r '.number // empty')
            pr_mergeable=$(printf '%s' "$pr_json" | jq -r '.mergeable // "UNKNOWN"')

            # Every run rebuilds this branch on the CURRENT base, so its
            # tip SHA always differs even when the dependency did not
            # move — and an unconditional force-push would fire a
            # duplicate 4-job CI run to re-validate a byte-identical
            # patch. `git patch-id --stable` hashes the diff alone, so a
            # pure rebase onto an UNCHANGED base compares equal and the
            # push is skipped.
            #
            # Three conditions keep this honest:
            #   - an empty patch-id means "could not compare", never a
            #     match, or every no-op branch would collapse together;
            #   - a CONFLICTING PR is force-pushed anyway, so branches
            #     cannot rot against a base they no longer apply to
            #     (Renovate's rebaseWhen=conflicted, in effect);
            #   - a branch whose remote base has fallen behind the
            #     current base_head (old_base != base_head) is rebased
            #     and re-pushed even when the dep patch is identical, so
            #     the PR is re-validated against the base it will merge
            #     into (Renovate's rebaseWhen=behind-base-branch). This
            #     is what lets a PR self-heal after a base-branch CI fix
            #     instead of staying pinned to a stale, possibly broken
            #     base.
            remote_ref="refs/remotes/origin/$branch"
            new_id=$(git diff "$base_head".."$branch" | git patch-id --stable | awk '{print $1}')
            old_id=""
            old_base=""
            if git rev-parse --verify --quiet "$remote_ref" >/dev/null; then
              old_base=$(git merge-base "$remote_ref" "$base_head" || true)
              if [ -n "$old_base" ]; then
                old_id=$(git diff "$old_base".."$remote_ref" \
                  | git patch-id --stable | awk '{print $1}')
              fi
            fi

            if [ -n "$new_id" ] && [ "$new_id" = "$old_id" ] \
              && [ "$pr_mergeable" != "CONFLICTING" ] \
              && [ "$old_base" = "$base_head" ]; then
              echo "Skipping $branch (patch unchanged, already on current base)"
              # MUST still count as touched: the stale-PR step below
              # closes and DELETES any update/* PR missing from this
              # file, so a silent skip would make the pipeline close its
              # own valid PR and recreate it on the next run.
              echo "$branch" >>"$RUNNER_TEMP/touched-branches"
              continue
            fi

            # Never clobber human work. Every run REBUILDS this branch
            # from base in a fresh worktree, so a commit someone pushed
            # to the open PR exists only on the remote — the rebuilt
            # local branch has never seen it, and the force-push below
            # would destroy it silently.
            #
            # The patch-id guard above cannot catch this: a human commit
            # CHANGES the remote diff, so old_id != new_id and the guard
            # reads it as "the dependency moved, push".
            #
            # The stale-PR step's bot allowlist is also a different
            # property — it decides whether to CLOSE a PR a human has
            # engaged with, not whether to overwrite commits on its
            # branch.
            #
            # So compare authorship directly against the identity
            # git-bot-identity configured for this job, and REFUSE the
            # push when anything else authored a commit in range. A
            # refusal is the honest outcome: replaying the commits onto
            # a freshly re-derived tree could silently combine a human's
            # hand-fix with a bot hash that superseded it, and the human
            # is the only one who can say which wins. The branch simply
            # stops auto-updating until they resolve it.
            human_range=""
            if git rev-parse --verify --quiet "$remote_ref" >/dev/null; then
              # Prefer the merge-base range; fall back to base_head when
              # merge-base could not be computed. The fallback can only
              # WIDEN the range, so it errs toward refusing to push.
              human_range="${old_base:-$base_head}..$remote_ref"
            fi
            if [ -n "$human_range" ]; then
              human_commits=$(git log --format='%H %ae' "$human_range" \
                | awk -v bot="$bot_email" '$2 != bot {print $1}')
              if [ -n "$human_commits" ]; then
                n=$(printf '%s\n' "$human_commits" | wc -l | tr -d ' ')
                echo "::warning title=Update branch has human commits::" \
                  "Refusing to force-push $branch — $n non-bot commit(s)" \
                  "on the remote branch would be destroyed."
                printf '%s\n' "$human_commits" | while read -r sha; do
                  git log --no-walk --format='  %h %an <%ae>: %s' "$sha"
                done
                # Same reasoning as the patch-id skip above: count it as
                # touched so the stale-PR step does not close the PR.
                echo "$branch" >>"$RUNNER_TEMP/touched-branches"
                continue
              fi
            fi

            echo "Pushing $branch ($subject)..."
            git push -f origin "$branch"

            if [ -n "$existing_pr" ]; then
              gh pr edit "$existing_pr" --title "$subject"
              echo "PR #$existing_pr updated for $branch"
            else
              pr_body="Automated dependency update.\n\n**Branch:** \`$branch\`\n\nValidated on both x86_64-linux and aarch64-darwin via CI.\nMerge when checks pass.\n\n---\nGenerated by the update pipeline."
              echo -e "$pr_body" > "$RUNNER_TEMP/pr-body.md"
              gh pr create \
                --base "$BRANCH_NAME" \
                --head "$branch" \
                --title "$subject" \
                --body-file "$RUNNER_TEMP/pr-body.md" || echo "PR creation failed for $branch"
            fi

            echo "$branch" >>"$RUNNER_TEMP/touched-branches"
          done

          # Sentinel — only written on clean loop exit. The close step
          # below refuses to act without this file (defense in depth on
          # top of `if: success()`).
          touch "$RUNNER_TEMP/ninja-completed.flag"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Close stale dependency PRs that were not touched this run.
      # Renovate-style policy: only auto-close PRs with NO human activity
      # (author=bot, all commits=bot, all reviews=bot/copilot, all
      # comments=bot/copilot). Anything with human touches is preserved.
      # `gh pr close --delete-branch` removes the remote branch in one call.
      - name: Close stale dependency PRs
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          # Refuse to act if the previous step didn't complete.
          if [ ! -f "$RUNNER_TEMP/ninja-completed.flag" ]; then
            echo "Pipeline did not complete cleanly — skipping stale PR cleanup."
            exit 0
          fi

          touched="$RUNNER_TEMP/touched-branches"

          # Allowlist of "non-human" actors. Any review or comment from
          # one of these still counts as untouched-by-humans.
          #
          # Login surface is inconsistent across `gh pr view` fields:
          #   .author.login         → "app/nix-agentic-tools-bot"  (App slug)
          #   .commits[].authors[]  → "nix-agentic-tools-bot[bot]" (User login)
          #   .reviews[].author     → "nix-agentic-tools-bot[bot]" (User login)
          #   .comments[].author    → same
          # So the allowlist needs BOTH forms for our bot, plus the
          # equivalent for GitHub's Copilot reviewer and github-actions.
          allowed_logins='[
            "app/nix-agentic-tools-bot",
            "nix-agentic-tools-bot",
            "nix-agentic-tools-bot[bot]",
            "app/copilot-swe-agent",
            "Copilot",
            "copilot",
            "copilot[bot]",
            "app/github-actions",
            "github-actions[bot]"
          ]'

          is_bot_only_pr() {
            local pr=$1
            local data
            data=$(gh pr view "$pr" --json author,commits,reviews,comments)

            # Author must be a known bot login (exact match on allowlist)
            jq -e --argjson allow "$allowed_logins" \
              '(.author.login // "") as $a | $allow | any(. == $a)' \
              <<<"$data" >/dev/null || return 1

            # No commits authored by anyone outside the allowlist
            jq -e --argjson allow "$allowed_logins" \
              '[.commits[].authors[]?.login // empty]
               | all(. as $u | $allow | any(. == $u))' \
              <<<"$data" >/dev/null || return 1

            # No reviews by anyone outside the allowlist
            jq -e --argjson allow "$allowed_logins" \
              '[.reviews[]?.author.login // empty]
               | all(. as $u | $allow | any(. == $u))' \
              <<<"$data" >/dev/null || return 1

            # No comments by anyone outside the allowlist
            jq -e --argjson allow "$allowed_logins" \
              '[.comments[]?.author.login // empty]
               | all(. as $u | $allow | any(. == $u))' \
              <<<"$data" >/dev/null || return 1

            return 0
          }

          echo "Touched this run:"
          if [ -s "$touched" ]; then
            sed 's/^/  /' "$touched"
          else
            echo "  (none)"
          fi

          gh pr list --base "$BRANCH_NAME" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("update/")) | "\(.number)|\(.headRefName)"' \
          | while IFS='|' read -r pr_num pr_branch; do
              if grep -qxF "$pr_branch" "$touched"; then
                echo "PR #$pr_num ($pr_branch): TOUCHED — keep"
                continue
              fi
              if is_bot_only_pr "$pr_num"; then
                echo "PR #$pr_num ($pr_branch): BOT-ONLY, untouched — closing + deleting branch"
                gh pr close "$pr_num" --delete-branch \
                  --comment "Auto-closed: dependency no longer needs updating (removed from matrix or merged into base). No human activity on the PR." \
                  || echo "  WARN: close failed for #$pr_num"
              else
                echo "PR #$pr_num ($pr_branch): HUMAN ACTIVITY — preserving"
              fi
            done
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report
          path: .update-report.txt
          if-no-files-found: ignore

      - name: Print update report
        if: always()
        run: |
          if [ -f .update-report.txt ]; then
            echo "::group::Update Report"
            bash dev/scripts/update-report.sh
            echo "::endgroup::"
          else
            echo "No report generated"
          fi

      # Cosmetic red: fail the job if any per-dependency target was held
      # back. Runs last so PR creation, stale-PR cleanup, and report steps
      # all complete first — the surviving updates still land as PRs.
      # No untrusted input; report is produced by in-repo scripts.
      - name: Surface held-back updates as a warning
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          if [ -f .update-report.txt ]; then
            while IFS= read -r line; do
              pkg=$(echo "$line" | sed -E 's/^HELD BACK: ([^ |]+).*/\1/')
              reason=$(echo "$line" | grep -oE '\([^)]+\)$' || true)
              echo "::warning::held back: ${pkg} ${reason}"
            done < <(grep '^HELD BACK:' .update-report.txt || true)
          fi

      # Detect whether upstream nixos-unstable HEAD has restored per-platform
      # SEA support for github-copilot-cli. Our overlay is a STANDALONE
      # derivation targeting SEA — if upstream offers it again, we could
      # consider switching back to an overrideAttrs overlay on upstream.
      # See overlays/copilot-cli.nix for rationale.
      - name: Detect upstream copilot-cli SEA restoration
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          sr=$(nix eval --raw --impure --expr '
            let p = (builtins.getFlake "github:NixOS/nixpkgs/nixos-unstable").legacyPackages.x86_64-linux;
            in p.github-copilot-cli.sourceRoot or "<missing>"
          ' 2>/dev/null || echo "<error>")
          case "$sr" in
            "package")
              echo "copilot-cli: upstream nixos-unstable sourceRoot=\"package\" (expected). No annotation."
              ;;
            ".")
              echo "::warning::copilot-cli: upstream nixos-unstable HEAD now ships per-platform SEA (github-copilot-cli.sourceRoot=\".\"). Our overlay is a STANDALONE derivation targeting SEA — consider whether overlays/copilot-cli.nix can switch back to an overrideAttrs overlay on upstream."
              ;;
            *)
              echo "::warning::copilot-cli: upstream nixos-unstable HEAD sourceRoot is unexpected value \"${sr}\". Upstream may have changed packaging mechanism — re-evaluate overlays/copilot-cli.nix."
              ;;
          esac

      # Diagnostic dump — runs on success/fail/cancel/timeout.
      # Surfaces per-target sidecar logs and process state even when
      # ninja's stdout capture is lost (e.g., on cancellation).
      - name: Diagnostic dump
        if: always()
        env:
          NAT_UPDATE_WORKTREES_DIR: ${{ runner.temp }}/nat-update-worktrees
        run: |
          set +e
          echo "::group::.update-report.txt"
          [ -f .update-report.txt ] && cat .update-report.txt || echo "(no report)"
          echo "::endgroup::"

          echo "::group::orphaned worktrees"
          ls -la "${NAT_UPDATE_WORKTREES_DIR}/" 2>/dev/null || echo "(none)"
          echo "::endgroup::"

          echo "::group::lingering nix/ninja/bash processes"
          pgrep -af "nix|ninja|update-" || echo "(none)"
          echo "::endgroup::"

          if [ -d .update-logs ]; then
            # Glob `*` (not `*.log`) — forensic JSON result files from
            # the run_nfb_build wrapper land alongside the .log sidecars
            # and need to be dumped too when builds fail.
            for f in .update-logs/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "::group::log: $name"
              cat "$f"
              echo "::endgroup::"
            done
          else
            echo "(no .update-logs/ directory)"
          fi
