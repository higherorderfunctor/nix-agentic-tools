# Each dependency is prepared and published independently on a pinned main base.
# Automation comes from the selected workflow ref; bot PRs never include it.
name: Update

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description:
          Optional comma-separated target names (disables stale PR cleanup)
        required: false
        default: ""
        type: string

# All workflow refs publish the same update/* branches. A newer Update sweep
# cancels the older sweep; CI uses a separate concurrency group.
concurrency:
  group: update-refs/heads/main
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BRANCH_NAME: main

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.base.outputs.sha }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: main
          persist-credentials: false
      - name: Pin update base
        id: base
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Discover update targets
        id: targets
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || '' }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix eval --json --option allow-import-from-derivation false .#updateTargets > "$RUNNER_TEMP/targets.json"
          python3 "$GITHUB_WORKSPACE/automation/dev/scripts/update-matrix.py" discover
  update:
    needs: discover
    name: update (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      NAT_UPDATE_EVAL_MAX_MEMORY: 4096
      NAT_UPDATE_EVAL_WORKERS: 1
      NAT_UPDATE_JOBS: 1
      NAT_UPDATE_VERIFY_PACKAGES: 0
      NIX_CONFIG: |
        max-jobs = 1
        cores = 0
      NIX_PATH: nixpkgs=flake:nixpkgs
      UPDATE_BASE_SHA: ${{ needs.discover.outputs.base }}
      UPDATE_TARGET: ${{ matrix.name }}
    steps:
      - name: Record preparation deadline
        id: deadline
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          echo "epoch=$(( $(date +%s) + 105 * 60 ))" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ needs.discover.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: nix-agentic-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: kiro-cli
      - uses: ./automation/.github/actions/git-bot-identity
        with:
          account: nix-agentic-tools-bot[bot]
          path: source
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install preparation tools
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          nix profile add --inputs-from . nixpkgs#devenv
          nix profile add ".#formatter.x86_64-linux"
      - name: Warm IFD sources
        uses: ./automation/.github/actions/warm-ifd
        with:
          best-effort: "false"
          path: source
          retries: "1"
          systems: x86_64-linux
      - name: Calculate remaining preparation time
        id: budget
        env:
          PIPELINE_DEADLINE: ${{ steps.deadline.outputs.epoch }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          minutes=$(( (PIPELINE_DEADLINE - $(date +%s)) / 60 ))
          if [ "$minutes" -lt 1 ]; then
            echo "::error::Setup exhausted the preparation budget."
            exit 1
          fi
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - name: Prepare dependency branch
        id: prepare
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes || '1') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAT_UPDATE_WORKTREES_DIR: ${{ runner.temp }}/nat-update-worktrees
          WORKTREE_LOCK: ${{ runner.temp }}/nix-update-worktree
          UPDATE_TARGET_JSON: ${{ toJSON(matrix) }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          mkdir -p .update-logs
          python3 "$GITHUB_WORKSPACE/automation/dev/scripts/update-matrix.py" prepare 2>&1 | tee .update-logs/prepare.log
      - name: Generate publishing App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Publish completed dependency PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          bash "$GITHUB_WORKSPACE/automation/dev/scripts/update-publish.sh"
          python3 "$GITHUB_WORKSPACE/automation/dev/scripts/update-matrix.py" receipt
      - name: Upload published target receipt
        uses: actions/upload-artifact@v4
        with:
          name: update-receipt-${{ matrix.name }}
          path: ${{ runner.temp }}/update-receipt.json
          if-no-files-found: error
      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report-${{ matrix.name }}
          path: |
            source/.update-report.txt
            source/.update-logs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Print update report
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          cat .update-report.txt || true
          ps -Ao pid,ppid,etime,command | command grep -E "nix|update-" || true
  cleanup:
    needs:
      - discover
      - update
    if:
      ${{ !cancelled() && needs.discover.result == 'success' && !inputs.targets
      }}
    runs-on: ubuntu-latest
    # Reading the PREVIOUS sweep's receipt artifact is what makes a repeated
    # hold-back distinguishable from a first one. A job-level block REPLACES the
    # workflow default rather than extending it, so contents is restated.
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    env:
      UPDATE_BASE_SHA: ${{ needs.discover.outputs.base }}
      UPDATE_MATRIX: ${{ needs.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ needs.discover.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: update-receipt-*
          path: source/receipts
      - name: Require complete sweep receipts
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          python3 "$GITHUB_WORKSPACE/automation/dev/scripts/update-matrix.py" collect
      - name: Generate publishing App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Close stale dependency PRs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          bash "$GITHUB_WORKSPACE/automation/dev/scripts/update-cleanup.sh"
      # A HELD BACK target leaves the sweep green by design: no PR was written,
      # so branch CI has nothing to judge. That is correct and it is also how a
      # blocked target stayed invisible for three sweeps on 2026-09-16. This
      # step fails the sweep once a target has been held back TWICE running.
      #
      # Placement after `Close stale dependency PRs` is load-bearing: the
      # completion sentinel and the cleanup script have both already run, so a
      # failure here cannot disable stale-PR cleanup repo-wide the way one
      # raised earlier in this job would. It uses the default workflow token,
      # not the App token above -- it only reads its own runs' artifacts.
      - name: Escalate repeated hold-backs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          python3 "$GITHUB_WORKSPACE/automation/dev/scripts/update-matrix.py" escalate
  annotations:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ needs.discover.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Detect upstream copilot-cli SEA restoration
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          sr=$(nix eval --raw --impure --expr '
            let p = (builtins.getFlake "github:NixOS/nixpkgs/nixos-unstable").legacyPackages.x86_64-linux;
            in p.github-copilot-cli.sourceRoot or "<missing>"
          ' 2>/dev/null || echo "<error>")
          case "$sr" in
            "package")
              echo "copilot-cli: upstream nixos-unstable sourceRoot=\"package\" (expected). No annotation."
              ;;
            ".")
              echo "::warning::copilot-cli: upstream nixos-unstable HEAD now ships per-platform SEA (github-copilot-cli.sourceRoot=\".\"). Our overlay is a STANDALONE derivation targeting SEA — consider whether packages/copilot-cli/packages/ai/copilot-cli/package.nix can switch back to an overrideAttrs overlay on upstream."
              ;;
            *)
              echo "::warning::copilot-cli: upstream nixos-unstable HEAD sourceRoot is unexpected value \"${sr}\". Upstream may have changed packaging mechanism — re-evaluate packages/copilot-cli/packages/ai/copilot-cli/package.nix."
              ;;
          esac
      - name: Detect a new pnpm major upstream
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          # npm publishes per-major channels as BOTH `latest-<N>` and
          # `next-<N>`. Key on `latest-<N>` and NEVER on `next-<N>`.
          # Measured 2026-07-25: `next-12` ALREADY EXISTS (12.0.0-alpha.21)
          # while no `latest-12` does. A next-keyed detector would therefore
          # annotate on every single sweep starting immediately — it would
          # look exactly like a working detector while being pure noise, and
          # would burn the signal for the real event. `latest-<N>` appears
          # only once a major has a stable release, which is precisely when a
          # human should consider sliding the window. Do not "improve" this
          # back to `next`.
          tags=$(curl -fsSL https://registry.npmjs.org/pnpm | jq -r '.["dist-tags"] | keys[]' || true)
          upstream_max=$(printf '%s\n' "$tags" | sed -n 's/^latest-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)

          # DERIVED from the repo, never hardcoded: a literal `11` here
          # would rot silently the moment the window slides, and a detector
          # that has quietly stopped detecting is worse than none.
          ours=$(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames 2>/dev/null \
            | jq -r '.[] | select(test("^pnpm_[0-9]+$"))' | sed 's/^pnpm_//' | sort -n | tail -1 || true)

          if [ -z "$upstream_max" ] || [ -z "$ours" ]; then
            echo "pnpm: could not determine majors (upstream='${upstream_max}' ours='${ours}') — no annotation."
            exit 0
          fi

          if [ "$upstream_max" -gt "$ours" ]; then
            echo "::warning::pnpm: upstream publishes a stable latest-${upstream_max} dist-tag, but this repo carries up to pnpm_${ours}. Add it deliberately — a recipe under packages/pnpm/packages/ai/generic/pnpm_${upstream_max}/, its owner-local sidecar, registry contributions in packages/pnpm/registry.nix, and a docs/packaging.md row. RETIRING an old major is a SEPARATE decision, not part of this: the window is not fixed-width (10, 11 and 12 are all carried today). CHECK FIRST whether the new major is still the same KIND of artifact — pnpm 12 moved its implementation out of the npm package into per-platform native binaries, so it could not use pnpm-major.nix at all and nixpkgs had no pnpm_12 to override. Not auto-bumped and not auto-PRed on purpose."
          else
            echo "pnpm: upstream stable majors top out at ${upstream_max}; this repo carries up to pnpm_${ours}. No annotation."
          fi
      - name: Detect a newer @aihubmix/mcp on npm
        if: always()
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :

          # `// empty` matters: a missing dist-tag makes `jq -r` print the
          # string "null", which would compare unequal to our pin forever
          # and annotate on every sweep. Emitting nothing instead lands in
          # the could-not-determine branch below.
          upstream=$(curl -fsSL https://registry.npmjs.org/@aihubmix/mcp \
            | jq -r '.["dist-tags"].latest // empty' || true)

          # DERIVED from the repo, never hardcoded. The overlay's version is
          # "<upstream>+save-to-file" — `+` is this repo's local-delta
          # separator — so strip the suffix. A literal here would rot
          # silently on the next bump, and a detector that has quietly
          # stopped detecting is worse than none. This form is
          # version-agnostic on purpose: it survived the 1.0.0 -> 1.1.0
          # bump untouched, which is the property to preserve.
          ours=$(nix eval --raw .#packages.x86_64-linux.aihubmix-mcp.version 2>/dev/null | cut -d+ -f1 || true)

          if [ -z "$upstream" ] || [ -z "$ours" ]; then
            echo "aihubmix-mcp: could not determine versions (upstream='${upstream}' ours='${ours}') — no annotation."
            exit 0
          fi

          if [ "$upstream" != "$ours" ]; then
            echo "::warning::aihubmix-mcp: npm dist-tags.latest is ${upstream}, this repo carries ${ours}. Bumping is HUMAN work, not a hash refresh: re-author packages/aihubmix-mcp/patches/aihubmix-mcp-save-to-file.patch against the new build/tools/painting-tools.js and confirm it applies with NO fuzz, regenerate aihubmix-mcp-package-lock.json (npm publishes none), re-derive both hashes via lib.fakeHash, and check whether image_generate's model enum or tool set changed. If upstream has grown a native save-to-disk argument, drop the patch instead and convert this package to a real config.update.targets row, deleting this step. Not auto-bumped and not auto-PRed on purpose."
          else
            echo "aihubmix-mcp: npm dist-tags.latest is ${upstream}; this repo carries ${ours}. No annotation."
          fi
