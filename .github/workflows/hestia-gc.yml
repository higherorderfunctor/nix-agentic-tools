name: CI check cache GC

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: hestia-gc
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-agentic-tools
      - uses: ./.github/actions/check-cache
        with:
          read-only: "true"
      - name: Collect stale CI-only cache roots and packs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euETo pipefail
          shopt -s inherit_errexit 2>/dev/null || :
          "$HESTIA_BIN" gc
