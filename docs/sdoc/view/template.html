<title>Canon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Spline+Sans+Mono:wght@400;600&display=swap"
/>
<style>
  /* A content-blind page over one payload (schema whiteboard-view/2).
   The only vocabularies written into this file are the schema's keys, the
   sixteen widget words, the four place words, the five query words, the eight
   legend colour names and the layout rules (a root's Start with its check
   findings, the Nodes index, an index of screen children, the rows that link
   a screen, prev/next, crumbs, routes). Every other word on the page arrives
   in the payload. */
  :root {
    --ground: #f5f6f4;
    --surface: #ffffff;
    --surface2: #ebede9;
    --ink: #1c2321;
    --ink2: #4a544f;
    --ink3: #6f7973;
    --line: #d5d9d4;
    --focus: #2f6fd6;
    --edge: rgba(28, 35, 33, 0.3);
    --c-green: #2e8b57;
    --c-slate: #6a5acd;
    --c-amber: #b8860b;
    --c-blue: #2f6fd6;
    --c-red: #c43d3d;
    --c-teal: #1a7f7a;
    --c-violet: #8b3fbf;
    --c-grey: #66706b;
    --display:
      "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
    --body:
      "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto,
      sans-serif;
    --mono:
      "Spline Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
      monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141816;
      --surface: #1c2220;
      --surface2: #242b28;
      --ink: #e6eae7;
      --ink2: #b3bbb6;
      --ink3: #8a948e;
      --line: #2f3834;
      --focus: #5f8ce0;
      --edge: rgba(0, 0, 0, 0.75);
      --c-green: #37a366;
      --c-slate: #8c7bde;
      --c-amber: #b98d1f;
      --c-blue: #5f8ce0;
      --c-red: #dc665c;
      --c-teal: #3fb3ad;
      --c-violet: #b48ae6;
      --c-grey: #98a29c;
    }
  }
  :root[data-theme="dark"] {
    --ground: #141816;
    --surface: #1c2220;
    --surface2: #242b28;
    --ink: #e6eae7;
    --ink2: #b3bbb6;
    --ink3: #8a948e;
    --line: #2f3834;
    --focus: #5f8ce0;
    --edge: rgba(0, 0, 0, 0.75);
    --c-green: #37a366;
    --c-slate: #8c7bde;
    --c-amber: #b98d1f;
    --c-blue: #5f8ce0;
    --c-red: #dc665c;
    --c-teal: #3fb3ad;
    --c-violet: #b48ae6;
    --c-grey: #98a29c;
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html {
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  a {
    color: inherit;
  }
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }
  code,
  .mono {
    font-family: var(--mono);
    font-size: 0.86em;
  }
  h1,
  h2,
  h3,
  h4 {
    font-family: var(--display);
    font-weight: 700;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  h1 {
    font-size: 1.6rem;
  }
  h2 {
    font-size: 1.3rem;
  }
  h3 {
    font-size: 1.05rem;
  }
  h4 {
    font-size: 0.95rem;
  }
  p {
    margin: 0;
    overflow-wrap: anywhere;
  }
  .muted {
    color: var(--ink3);
  }
  .dim {
    color: var(--ink2);
  }
  .small {
    font-size: 0.88rem;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink3);
    overflow-wrap: anywhere;
  }
  a.kicker {
    text-decoration: none;
  }
  a.kicker:hover {
    text-decoration: underline;
  }

  /* colour classes: a legend colour name maps to one token, nothing else */
  .c-green {
    --tagc: var(--c-green);
  }
  .c-slate {
    --tagc: var(--c-slate);
  }
  .c-amber {
    --tagc: var(--c-amber);
  }
  .c-blue {
    --tagc: var(--c-blue);
  }
  .c-red {
    --tagc: var(--c-red);
  }
  .c-teal {
    --tagc: var(--c-teal);
  }
  .c-violet {
    --tagc: var(--c-violet);
  }
  .c-grey {
    --tagc: var(--c-grey);
  }
  .c-none {
    --tagc: var(--ink3);
  }

  /* header */
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px 12px;
    padding: 10px 16px 6px;
    flex-wrap: wrap;
  }
  .brand a.name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .pill {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--c-amber);
    color: var(--c-amber);
    white-space: nowrap;
  }
  .switches {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    margin-left: auto;
  }
  .switches button,
  .switch {
    font: inherit;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink3);
    cursor: pointer;
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .switches button[aria-pressed="true"],
  .switch[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--ink2);
    background: var(--surface2);
  }
  .switches button i,
  .switch i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
  }
  .switches button[aria-pressed="true"] i,
  .switch[aria-pressed="true"] i {
    background: var(--c-green);
  }
  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    padding: 0 10px;
    scrollbar-width: none;
    align-items: flex-end;
  }
  .tabs::-webkit-scrollbar {
    display: none;
  }
  .tabs.scrollx {
    --scroll-bg: var(--ground);
  }
  .tabs a {
    flex: 0 0 auto;
    padding: 8px 10px 8px;
    text-decoration: none;
    font-size: 0.92rem;
    color: var(--ink2);
    border-bottom: 3px solid transparent;
    font-family: var(--display);
    font-weight: 500;
    max-width: 9rem;
    line-height: 1.15;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    max-height: calc(2.3em + 16px);
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .tabs a[aria-current="page"] {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }
  .tabs.sub {
    padding: 0;
    margin: -6px 0 4px;
    border-bottom: 1px solid var(--line);
  }
  .tabs.sub a {
    font-size: 0.84rem;
    padding: 6px 7px 6px;
    max-height: calc(2.3em + 12px);
  }

  /* horizontal scrollers: a shadow on whichever edge hides more content.
     The two covering layers scroll with the content (background-attachment:
     local) and slide off the edge as it is reached; the two shadow layers
     stay put, so a shadow shows exactly while there is more to scroll to. */
  .scrollx {
    --scroll-bg: var(--surface);
    background:
      linear-gradient(90deg, var(--scroll-bg) 40%, transparent) left / 36px 100%,
      linear-gradient(270deg, var(--scroll-bg) 40%, transparent) right / 36px
        100%,
      radial-gradient(farthest-side at 0 50%, var(--edge), transparent) left /
        18px 100%,
      radial-gradient(farthest-side at 100% 50%, var(--edge), transparent)
        right / 18px 100%;
    background-repeat: no-repeat;
    background-attachment: local, local, scroll, scroll;
  }

  /* layout */
  main {
    padding: 16px 16px 72px;
    max-width: 760px;
    margin: 0 auto;
  }
  .screen > * + * {
    margin-top: 18px;
  }
  .stack > * + * {
    margin-top: 10px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    scroll-margin-top: 120px;
  }
  .card > * + * {
    margin-top: 10px;
  }
  section.sec {
    scroll-margin-top: 120px;
  }
  section.sec > * + * {
    margin-top: 10px;
  }
  .banner {
    background: color-mix(in oklab, var(--c-amber) 12%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--c-amber) 45%, var(--line));
    border-radius: 10px;
    padding: 12px 16px;
  }
  .banner > * + * {
    margin-top: 8px;
  }
  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .between {
    justify-content: space-between;
  }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 640px) {
    .grid2 {
      grid-template-columns: 1fr 1fr;
    }
  }
  footer {
    padding: 20px 16px 40px;
    max-width: 760px;
    margin: 0 auto;
    color: var(--ink3);
    font-size: 0.85rem;
  }
  footer code {
    overflow-wrap: anywhere;
  }
  ul.plain {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.plain > li + li {
    margin-top: 6px;
  }
  .hit {
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--focus) 55%, transparent);
  }
  .off {
    color: var(--ink3);
    font-style: italic;
  }
  .clamp {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* word chips (legend words) and swatches */
  .word {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.03em;
    color: var(--ink2);
    white-space: nowrap;
  }
  .word i {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--tagc, var(--ink3));
    flex: none;
  }
  .word.big {
    font-size: 0.82rem;
  }
  .word .n {
    color: var(--ink3);
  }

  /* chips */
  .chip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--surface2);
    color: var(--ink2);
    white-space: nowrap;
  }
  .chip b {
    color: var(--ink);
    font-weight: 600;
  }
  .chip small {
    font-size: 0.66rem;
    color: var(--ink3);
    margin-left: 4px;
  }
  .flag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--ink2);
    white-space: nowrap;
  }
  .flag.warn {
    border-color: var(--c-red);
  }
  .count {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink3);
  }

  /* node links: block form puts the title on its own line under the id */
  a.node {
    display: block;
    text-decoration: none;
    padding: 3px 0;
    line-height: 1.45;
  }
  a.node code {
    display: inline-block;
    max-width: 100%;
    font-size: 0.78rem;
    color: var(--ink);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 5px;
    overflow-wrap: anywhere;
    margin-right: 8px;
    vertical-align: baseline;
  }
  a.node .t {
    color: var(--ink2);
    font-size: 0.92rem;
  }
  a.node:hover .t {
    text-decoration: underline;
  }
  a.node.inline {
    display: inline;
    padding: 0;
  }
  a.node.inline code {
    display: inline;
    font-size: 0.8em;
    margin: 0;
  }
  span.node code {
    font-size: 0.78rem;
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 5px;
  }

  /* rows widget */
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filters button {
    font: inherit;
    font-size: 0.82rem;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink2);
    cursor: pointer;
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .filters button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--ground);
    border-color: var(--ink);
  }
  .filters button i {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--tagc, var(--ink3));
  }
  .line {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--tagc, var(--ink3));
    border-radius: 10px;
    padding: 12px 14px 10px;
    scroll-margin-top: 120px;
  }
  .line > * + * {
    margin-top: 8px;
  }
  .line-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .line .h {
    font-size: 1rem;
    line-height: 1.45;
  }
  .line .by {
    font-size: 0.9rem;
    color: var(--ink2);
  }
  .line .by b {
    font-weight: 400;
    color: var(--ink3);
  }
  .line .idx {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink3);
  }
  .crumb {
    font-size: 0.8rem;
    color: var(--ink3);
    text-decoration: none;
  }
  .crumb:hover {
    text-decoration: underline;
  }
  .refs {
    list-style: none;
    padding: 6px 0 0;
    margin: 0;
    border-top: 1px dashed var(--line);
  }
  .refs li {
    margin: 0;
  }
  .refs .kicker {
    margin-top: 4px;
  }
  details.orig summary {
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--ink3);
    list-style: none;
  }
  details.orig summary::before {
    content: "▸ ";
  }
  details.orig[open] summary::before {
    content: "▾ ";
  }
  details.orig p {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 0.78rem;
    line-height: 1.5;
    color: var(--ink2);
    overflow-wrap: anywhere;
    background: var(--surface2);
    padding: 8px 10px;
    border-radius: 6px;
    white-space: pre-wrap;
  }

  /* strip and tally */
  .heat {
    display: grid;
    grid-template-columns: minmax(120px, 38%) 1fr;
    gap: 8px 12px;
    align-items: center;
  }
  .heat-label {
    text-decoration: none;
    font-size: 0.9rem;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .heat-label:hover {
    text-decoration: underline;
  }
  .heat-label .n {
    color: var(--ink3);
    font-size: 0.8rem;
  }
  .bar {
    display: flex;
    gap: 2px;
    height: 22px;
  }
  .seg {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--tagc);
    color: #fff;
    font-family: var(--mono);
    font-size: 0.72rem;
    text-decoration: none;
    border-radius: 3px;
    min-width: 6px;
    overflow: hidden;
  }
  .seg:hover {
    filter: brightness(1.12);
  }
  .totals .bar {
    height: 28px;
  }

  /* legend widget */
  .legend {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 12px;
    align-items: baseline;
  }
  .legend .meaning {
    font-size: 0.92rem;
    color: var(--ink2);
  }
  .legend .cn {
    font-size: 0.72rem;
    color: var(--ink3);
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* definition lists: glossary, facts, fields */
  dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 14px;
    font-size: 0.92rem;
  }
  dt {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink3);
    padding-top: 4px;
    overflow-wrap: anywhere;
  }
  dd {
    min-width: 0;
    margin: 0;
    overflow-wrap: anywhere;
  }
  dl.words dt {
    padding-top: 0;
    font-size: 0.95rem;
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink);
    font-family: var(--body);
    font-weight: 700;
  }
  dl.words {
    grid-template-columns: minmax(100px, 30%) 1fr;
  }
  dl.words dt a {
    text-decoration: none;
  }
  dl.words dt a:hover {
    text-decoration: underline;
  }
  dl.facts {
    grid-template-columns: minmax(80px, 24%) 1fr;
  }
  dl.fields {
    grid-template-columns: minmax(90px, 24%) 1fr;
  }
  @media (max-width: 480px) {
    dl.fields,
    dl.facts {
      grid-template-columns: 1fr;
    }
    dl.fields dt,
    dl.facts dt {
      padding-top: 6px;
    }
  }

  /* grid figure */
  .gridfig {
    display: grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 6px;
    align-items: stretch;
  }
  .gridfig .ax {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    align-self: center;
    padding: 4px;
  }
  .gridfig .ax.left {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
  }
  .cell {
    display: block;
    text-decoration: none;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 74px;
  }
  a.cell:hover {
    border-color: var(--ink2);
  }
  .cell b {
    font-family: var(--display);
    font-size: 1rem;
    display: block;
    overflow-wrap: anywhere;
  }
  .cell span {
    font-size: 0.82rem;
    color: var(--ink2);
  }
  .cell.empty {
    border-style: dashed;
  }
  .outside {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  @media (min-width: 560px) {
    .outside {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }
  .cellbadge {
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--ink2);
    display: inline-flex;
    gap: 8px;
    align-items: center;
  }
  .cellbadge i {
    width: 10px;
    height: 10px;
    border: 1px solid var(--ink2);
    border-radius: 2px;
  }
  .cellbadge i.f {
    background: var(--ink2);
  }

  /* ladders */
  .ladder {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .ladder .rung {
    font-family: var(--mono);
    font-size: 0.76rem;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface2);
  }
  .ladder .rung b {
    font-weight: 600;
  }
  .ladder .rung.ghost {
    border-style: dashed;
    background: transparent;
    color: var(--ink3);
  }
  .ladder .arrow {
    color: var(--ink3);
    font-size: 0.9rem;
  }

  /* layer stack */
  .layers {
    display: grid;
    gap: 4px;
  }
  .layer {
    display: grid;
    grid-template-columns: minmax(44px, max-content) 1fr;
    gap: 10px;
    border: 1px solid var(--line);
    border-left: 5px solid var(--tagc, var(--line));
    border-radius: 8px;
    padding: 8px 12px;
    background: var(--surface);
  }
  .layer .l {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1rem;
    max-width: 7rem;
    overflow-wrap: anywhere;

  const narrativeData=n=>NARRATIVE_DATA.includes(n.widget)&&(n.query==null||NARRATIVE_QUERIES.includes(n.query));
  const tabShown=t=>!(narrativeData(t)&&!nodeOn(subjectOf(t).uid));
  function topEntries(){
    const out=[{key:"start",label:"Start",href:"#/start"}];
    if(CANON) tabKids(CANON).filter(tabShown).forEach(t=>out.push({key:t.uid,label:t.title,href:narHref(t.uid)}));
    ROOTS.filter(r=>r!==CANON&&nodeOn(r.uid)).forEach(r=>out.push({key:r.uid,label:r.title,href:narHref(r.uid)}));
    out.push({key:"nodes",label:"Nodes",href:"#/nodes"});
    return out;
  }
  function topKeyFor(uid){
    const root=ROOTOF[uid]; if(!root) return "nodes";
    if(CANON&&root===CANON.uid){ for(let u=uid;u;u=PARENT[u]){ if(tabKids(CANON).some(t=>t.uid===u)) return u; } return "start"; }
    return root;
  }
  function renderHeader(){
    const brand=document.getElementById("brand");
    brand.textContent=CANON?CANON.title:"Canon";
    document.getElementById("hswitches").replaceChildren(switchRow(true)||"");
    const tabs=document.getElementById("tabs");
    tabs.replaceChildren(...topEntries().map(e=>h("a",{href:e.href,"data-key":e.key,title:e.label},e.label)));
  }
  function setPills(rootUid){
    const r=NAR[rootUid]&&isRoot(NAR[rootUid])?NAR[rootUid]:CANON;
    document.getElementById("pills").replaceChildren(...((r&&r.tags)||[]).map(t=>h("span",{class:"pill"},t)));
  }
  const miss=(text,href,label)=>[h("p",{},text),h("a",{href},label)];
  function route(){
    ON=readSelection();
    const raw=location.hash.replace(/^#\/?/,"");
    const parts=raw.split("/").filter(Boolean).map(decodeURIComponent);
    const top=parts[0]||"start";
    const main=document.getElementById("main");
    let out, current=top, target=null, rootUid=CANON?CANON.uid:null;
    try{
      switch(top){
        case "start": out=CANON?screenNar(CANON.uid):[h("p",{},"No roots in this payload.")]; current="start"; break;
        case "n": {
          const uid=LC[(parts[1]||"").toLowerCase()];
          if(!uid||!NAR[uid]){ out=miss("No such screen.","#/start","start"); current="start"; break; }
          rootUid=ROOTOF[uid];
          if(!nodeOn(uid)){ out=[h("h1",{},NAR[uid].title),h("p",{},offNote(uid)),h("a",{href:"#/start"},"start")]; current=topKeyFor(uid); break; }
          const owner=screenOf(uid);
          const ctx={};
          if(parts[2]==="row"&&parts[3]!=null) target=`row-${uid}-${parts[3]}`;
          else if(parts[2]!=null) ctx.word=parts[2];
          if(owner!==uid&&!target) target=`nar-${uid}`;
          if(CANON&&owner===CANON.uid){ out=screenNar(CANON.uid,ctx); current="start"; }
          else { out=screenNar(owner,ctx); current=topKeyFor(owner); }
          break; }
        case "nodes": {
          if(parts[1]){ const uid=LC[parts[1].toLowerCase()]||parts[1]; out=screenNode(uid); }
          else out=[h("h1",{},"Nodes"),nodesIndex()];
          current="nodes"; break; }
        default: out=miss("No such screen.","#/start","start");
      }
    }catch(e){ out=[h("p",{class:"warn"},"This screen failed to render: "+e.message)]; console.error(e); }
    main.replaceChildren(...out.flat(Infinity).filter(Boolean));
    setPills(rootUid);
    const r=rootUid&&NAR[rootUid]?NAR[rootUid]:CANON;
    document.title=r?r.title:"Canon";
    document.querySelectorAll("#tabs a").forEach(a=>{ if(a.dataset.key===current) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    // The strips scroll and hide their scrollbars, so the active tab is
    // centred by hand; only the strip moves, never the page.
    document.querySelectorAll("nav.tabs").forEach(tabs=>{ const cur=tabs.querySelector('a[aria-current="page"]'); if(cur){ const tb=tabs.getBoundingClientRect(), cb=cur.getBoundingClientRect(); tabs.scrollLeft+=cb.left-tb.left-(tabs.clientWidth-cb.width)/2; } });
    if(target){ const el=document.getElementById(target); if(el){ el.classList.add("hit"); el.scrollIntoView({block:"start"}); return; } }
    window.scrollTo(0,0);
  }
  function init(){
    if(DATA.schema!==SCHEMA){
      document.getElementById("main").append(h("p",{class:"warn"},"This page was built for schema ",h("code",{},SCHEMA)," and the payload says ",h("code",{},String(DATA.schema))," -- refusing to render."));
      return;
    }
    renderHeader();
    const gen=DATA.generated||{};
    document.getElementById("foot").append(h("p",{},"Generated ",gen.at||"",gen.canon_commit?[" from commit ",h("code",{},String(gen.canon_commit).slice(0,12))]:null,gen.export_sha256?[", export ",h("code",{},String(gen.export_sha256).slice(0,12))]:null,"; ",plural(ROOTS.length,"root"),", ",plural(Object.keys(NODES).length,"node"),". Every word on this page comes from the payload; the page itself knows only its shape."));
    window.addEventListener("hashchange",route);
    if(!location.hash) history.replaceState(null,"",location.search+"#/start");
    route();
  }
  init();
</script>
