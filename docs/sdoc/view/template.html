<style>

  :root[data-theme="dark"] {

<script>
  const DATA = /*DATA*/;

  const SCHEMA="whiteboard-view/1";
  const COLOURS=["green","slate","amber","blue","red","teal","violet","grey"];
  const WIDGETS=["prose","rows","table","glossary","legend","tally","edges"];
  const FPMARK={undeclared:"◌",unsigned:"○",signed:"●",drifted:"◐"};

  function h(tag, attrs={}, ...kids){
    const e=document.createElement(tag);
    for(const [k,v] of Object.entries(attrs||{})){
      if(v==null||v===false) continue;
      if(k==="class") e.className=v;
      else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
      else e.setAttribute(k,v);
    }
    for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
    return e;
  }
  const SVGNS="http://www.w3.org/2000/svg";
  function s(tag, attrs={}, ...kids){
    const e=document.createElementNS(SVGNS,tag);
    for(const [k,v] of Object.entries(attrs||{})){ if(v==null) continue; e.setAttribute(k,v); }
    for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
    return e;
  }

  /* ---------- indexes over the payload ---------- */
  const NODES=DATA.nodes||{};
  const LEGEND=Array.isArray(DATA.legend)?DATA.legend:[];
  const LEGW=Object.fromEntries(LEGEND.map(l=>[l.word,l]));
  const LADDERS=DATA.ladders||{};
  const GRAMMAR=DATA.grammar||{};
  const BACK=DATA.backlinks||{};
  const ROOT=DATA.tree;
  const NAR={}, PARENT={}, TAB={};
  (function index(n,parent,tab){ NAR[n.uid]=n; PARENT[n.uid]=parent; TAB[n.uid]=tab; (n.children||[]).forEach(c=>index(c,n.uid,tab||c.uid)); })(ROOT,null,null);
  const TABS=ROOT.children||[];

  const colourOf=word=>{ const l=word!=null?LEGW[word]:null; return l&&COLOURS.includes(l.colour)?l.colour:null; };
  const cls=word=>"c-"+(colourOf(word)||"none");
  const titleOf=uid=>NAR[uid]?NAR[uid].title:(NODES[uid]?NODES[uid].title:null);
  const hrefOf=uid=>NAR[uid]?`#/n/${enc(uid)}`:(NODES[uid]?`#/nodes/${enc(uid)}`:null);
  const enc=encodeURIComponent;
  const rank=(field,value)=>{ const l=LADDERS[field]; if(!Array.isArray(l)) return null; const i=l.indexOf(value); return i<0?null:[i+1,l.length]; };
  const plural=(n,one,many)=>`${n} ${n===1?one:(many||one+"s")}`;

  /* ---------- small components ---------- */
  function nodeLink(uid, inline){
    const t=titleOf(uid);
    const href=hrefOf(uid);
    if(!href) return h("span",{class:"node dead"+(inline?" inline":"")},h("code",{},uid),inline?" ":null,h("span",{class:"muted small"},inline?"(not in this payload)":" not in this payload"));
    // Inline, the title rides in the tooltip: spliced into a sentence it
    // makes the sentence unreadable, and the cites list below every
    // narrative shows each cited UID with its title in full.
    const a=h("a",{class:"node"+(inline?" inline":""),href,title:inline&&t!=null?t:undefined},h("code",{},uid));
    if(t!=null&&!inline) a.append(h("span",{class:"t"},t));
    return a;
  }
  function spans(list){ return (list||[]).map(sp=> sp&&sp.link!=null ? nodeLink(sp.link,true) : String(sp&&sp.t!=null?sp.t:"")); }
  const LINKTOKEN=/\[LINK:\s*([^\]\s]+)\s*\]/g;
  function linkifyText(text){
    const out=[]; let last=0; const str=String(text);
    str.replace(LINKTOKEN,(m,uid,off)=>{ out.push(str.slice(last,off)); out.push(hrefOf(uid)?nodeLink(uid,true):m); last=off+m.length; return m; });
    out.push(str.slice(last)); return out;
  }
  // A field's text, verbatim in content, reflowed in shape: a paragraph is
  // joined into one run unless a line of it is indented or holds a run of

    document.querySelectorAll("#tabs a").forEach(a=>{ if(a.dataset.key===current) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    // The strip scrolls and hides its scrollbar, so on a narrow screen the
    // active tab is centred in it by hand; only the strip moves, never the page.
    const tabs=document.getElementById("tabs"), cur=tabs.querySelector('a[aria-current="page"]');
    if(cur){ const tb=tabs.getBoundingClientRect(), cb=cur.getBoundingClientRect(); tabs.scrollLeft+=cb.left-tb.left-(tabs.clientWidth-cb.width)/2; }
    if(target){ const el=document.getElementById(target); if(el){ el.classList.add("hit"); el.scrollIntoView({block:"start"}); return; } }
    window.scrollTo(0,0);
  }
  function init(){
    if(DATA.schema!==SCHEMA){
      document.getElementById("main").append(h("p",{class:"warn"},"This page was built for schema ",h("code",{},SCHEMA)," and the payload says ",h("code",{},String(DATA.schema))," -- refusing to render."));
      return;
    }
    document.title=ROOT.title;
    const brand=document.getElementById("brand"); brand.textContent=ROOT.title;
    document.getElementById("brandsub").textContent=(DATA.generated&&DATA.generated.at)||"";
    const tabs=document.getElementById("tabs");
    tabs.append(h("a",{href:"#/start","data-key":"start"},"start"));
    TABS.forEach(t=>tabs.append(h("a",{href:`#/n/${enc(t.uid)}`,"data-key":"n:"+t.uid,title:t.title},t.title)));
    tabs.append(h("a",{href:"#/nodes","data-key":"nodes"},"nodes"));
    const gen=DATA.generated||{};
    document.getElementById("foot").append(h("p",{},"Generated ",gen.at||"",gen.canon_commit?[" from commit ",h("code",{},String(gen.canon_commit).slice(0,12))]:null,". Every word on this page comes from the payload; the page itself knows only its shape."));
    window.addEventListener("hashchange",route);
    if(!location.hash) history.replaceState(null,"","#/start");
    route();
  }
  init();
</script>
