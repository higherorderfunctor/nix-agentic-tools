# cspell:words rcgen rustix serde zeroize
[workspace]
resolver = "3"
members = ["crates/airlock"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[workspace.dependencies]
h2 = "0.4.20"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = [
  "client-legacy",
  "http1",
  "tokio",
] }
pem = "4.0.0"
rcgen = { version = "0.14.10", default-features = false, features = [
  "pem",
  "ring",
  "zeroize",
] }
rustix = { version = "1.1.5", default-features = false, features = [
  "fs",
  "process",
  "std",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-service = "0.3.3"
x509-parser = { version = "0.18.1", default-features = false, features = [
  "verify",
] }
zeroize = "1.9.1"
