[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
airlock-core = { path = "crates/airlock-core" }
airlock-gateway = { path = "crates/airlock-gateway" }
axum = { version = "0.8.7", features = ["ws"] }
base64 = "0.23.1"
cedar-policy = { version = "4.14.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.2", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = [
  "client",
  "http1",
  "http2",
  "server",
] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
log = "0.4.32"
percent-encoding = "2.3.2"
rcgen = { version = "0.14.10", default-features = false, features = [
  "pem",
  "ring",
  "x509-parser",
  "zeroize",
] }
rustix = { version = "1.1.5", default-features = false, features = [
  "process",
  "std",
] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "tls12",
] }
tokio-tungstenite = "0.28.0"
tower = "0.5.3"
tower-http = { version = "0.6.7", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
x509-parser = "0.18.1"
zeroize = "1.9.1"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
