# ast-grep rules (tree-sitter-rust) for the git-branchless config census.
#
# Rule ids are the contract with ../extract.py: each id's matches feed one
# resolver step there. No rule filters test code itself. The resolver drops
# every match inside a `test-item` span (an item carrying `#[cfg(test)]` or
# `#[test]`) and every match under a test-only path, so all rules share one
# definition of "test code".

# ── Test code ─────────────────────────────────────────────────────────
id: test-item
language: rust
rule:
  any:
    - kind: const_item
    - kind: enum_item
    - kind: expression_statement
    - kind: field_declaration
    - kind: function_item
    - kind: impl_item
    - kind: let_declaration
    - kind: macro_invocation
    - kind: match_arm
    - kind: mod_item
    - kind: static_item
    - kind: struct_item
    - kind: trait_item
    - kind: use_declaration
  follows:
    kind: attribute_item
    regex: '^#\[(cfg\(test\)|test)\]$'
    # Walk back over the item's other attributes and comments only.
    stopBy:
      not:
        any:
          - kind: attribute_item
          - kind: line_comment
          - kind: block_comment
---
# Any other cfg that mentions `test` (for example `cfg(all(test, unix))`) is
# neither production nor test code the resolver can classify: F11.
id: cfg-test-attr
language: rust
rule:
  kind: attribute_item
  regex: '\bcfg\b.*\btest\b'


# ── Structure: functions, bindings, constants ─────────────────────────
---
id: fn
language: rust
rule:
  kind: function_item
  has: { field: name, pattern: $NAME }
---
id: fn-returns-config
language: rust
rule:
  kind: function_item
  all:
    - has: { field: name, pattern: $NAME }
    - has: { field: return_type, regex: '\bConfig(Read)?\b' }
---
id: param
language: rust
rule:
  kind: parameter
  all:
    - has: { field: pattern, pattern: $ID }
    - has: { field: type, pattern: $T }
---
# A function's own parameters, in order (not those of nested closures or fns).
id: fn-param
language: rust
rule:
  kind: parameter
  all:
    - has: { field: pattern, pattern: $ID }
    - has: { field: type, pattern: $T }
  inside:
    kind: parameters
    inside: { kind: function_item }
---
id: let
language: rust
rule:
  kind: let_declaration
  all:
    - has: { field: pattern, pattern: $ID }
    - has: { field: value, pattern: $V }
  any:
    - has: { field: type, pattern: $T }
    - not: { has: { field: type, regex: "." } }
---
id: const
language: rust
rule:
  kind: const_item
  all:
    - has: { field: name, pattern: $ID }
    - has: { field: type, pattern: $T }
    - has: { field: value, pattern: $V }


# ── The config API surface itself (drift guard, F5) ───────────────────
---
id: api-trait-method
language: rust
rule:
  any:
    - kind: function_signature_item
    - kind: function_item
  has: { field: name, pattern: $NAME }
  inside:
    kind: trait_item
    has: { field: name, regex: "^Config(Read|Write)$" }
    stopBy: end
---
id: api-value-type
language: rust
rule:
  pattern: impl GetConfigValue<$T> for $U { $$$BODY }


# ── Call shapes (the only recognised ways to touch a config handle) ───
---
id: call-any
language: rust
rule:
  kind: call_expression
  has:
    field: function
    kind: field_expression
    all:
      - has: { field: value, pattern: $RECV }
      - has:
          {
            field: field,
            regex: "^(get|get_or|get_or_else|list|set|remove|set_multivar|remove_multivar)$",
            pattern: $M,
          }
---
id: shape-get
language: rust
rule: { pattern: "$RECV.get($KEY)" }
---
id: shape-get-turbofish
language: rust
rule: { pattern: "$RECV.get::<$T>($KEY)" }
---
id: shape-get-or
language: rust
rule: { pattern: "$RECV.get_or($KEY, $DEF)" }
---
id: shape-get-or-else
language: rust
rule: { pattern: "$RECV.get_or_else($KEY, $DEF)" }
---
id: shape-list
language: rust
rule: { pattern: "$RECV.list($KEY)" }
---
id: shape-set
language: rust
rule: { pattern: "$RECV.set($KEY, $VAL)" }
---
id: shape-remove
language: rust
rule: { pattern: "$RECV.remove($KEY)" }
---
id: shape-set-multivar
language: rust
rule: { pattern: "$RECV.set_multivar($KEY, $RE, $VAL)" }
---
id: shape-remove-multivar
language: rust
rule: { pattern: "$RECV.remove_multivar($KEY, $RE)" }


# ── Subprocess `git config ...` argv (F7) ─────────────────────────────
---
id: git-argv-config
language: rust
rule:
  kind: array_expression
  has: { kind: string_literal, regex: '^"config"$', nthChild: 1 }


# ── Raw git2 config access that bypasses the wrapper (F6) ─────────────
---
id: raw-config
language: rust
rule:
  any:
    - pattern: $X.config()
    - pattern: git2::Config
    - pattern: "git2::Config::$F($$$A)"


# ── Key and value resolution helpers ─────────────────────────────────
---
id: match-arm
language: rust
rule:
  kind: match_arm
  all:
    - has: { field: pattern, pattern: $P }
    - has: { field: value, pattern: $V }
---
id: match-arm-str
language: rust
rule:
  kind: match_arm
  all:
    - has: { field: pattern, pattern: $P }
    - has: { field: value, kind: string_literal, pattern: $V }
---
id: none-arm
language: rust
rule:
  kind: match_arm
  all:
    - has: { field: pattern, regex: "^None$" }
    - has: { field: value, pattern: $D }
  inside:
    kind: match_expression
    has: { field: value, pattern: $SUBJECT }
    stopBy: { kind: match_expression }
---
id: from-str
language: rust
rule: { pattern: "$ENUM::from_str($$$A)" }
---
id: enum-variant
language: rust
rule:
  kind: enum_variant
  has: { field: name, pattern: $V }
  inside:
    kind: enum_item
    has: { field: name, pattern: $E }
    stopBy: end
---
id: derive-value-enum
language: rust
rule:
  kind: attribute_item
  regex: "ValueEnum"
  precedes:
    kind: enum_item
    has: { field: name, pattern: $E }


# ── Every key-shaped string literal (F9: the literal net) ─────────────
# Literals inside macro token trees are tokens here too, so this also sees
# keys passed through `format!`, `vec!`, `writeln!` and closures.
---
id: key-literal
language: rust
rule:
  any: [{ kind: string_literal }, { kind: raw_string_literal }]
  regex: 'branchless\.[A-Za-z{*]'


# ── Builtin revset functions (F14) ────────────────────────────────────
# The `FUNCTIONS` table is looked up before `branchless.revsets.alias.*`,
# so an alias named after a builtin is dead. Its names are data.
---
id: revset-functions-table
language: rust
rule:
  kind: macro_invocation
  regex: 'static\s+ref\s+FUNCTIONS\b'
---
id: revset-function
language: rust
rule:
  kind: string_literal
  inside:
    kind: token_tree
    regex: '^\(\s*"[^"]*"\s*,\s*&\w+\s*\)$'
    inside:
      kind: macro_invocation
      regex: 'static\s+ref\s+FUNCTIONS\b'
      stopBy: end
---
id: functions-lookup
language: rust
rule: { pattern: "FUNCTIONS.get($N)" }


# ── Handle flow guards (F10) ──────────────────────────────────────────
---
id: producer-call
language: rust
rule:
  any:
    - pattern: $X.get_readonly_config()
    - pattern: Config::open($$$A)
    - pattern: Config::open_default()
    - pattern: $X.into_config()
---
id: field-config
language: rust
rule:
  kind: field_declaration
  all:
    - has: { field: name, pattern: $ID }
    - has: { field: type, regex: '\bConfig(Read)?\b', pattern: $T }
---
id: ufcs-config
language: rust
rule:
  any:
    - pattern: "ConfigRead::$M($$$A)"
    - pattern: "ConfigWrite::$M($$$A)"
    - pattern: "Config::$M($$$A)"
    - pattern: "$T::get_from_config($$$A)"
---
id: arg-call
language: rust
rule:
  kind: call_expression
  all:
    - has: { field: function, pattern: $F }
    - has: { field: arguments, pattern: $ARGS }
