model = "gpt-6-luna"
model_provider = "fake"
sandbox_mode = "read-only"
approval_policy = "never"
[model_providers.fake]
name = "fake"
base_url = "http://127.0.0.1:@PORT@/v1"
wire_api = "responses"
env_key = "FAKE_KEY"
[[hooks.SubagentStart]]
hooks = [{ type = "command", command = "python3 @H@/hook.py" }]
[[hooks.SubagentStop]]
hooks = [{ type = "command", command = "python3 @H@/hook.py" }]
[[hooks.PreToolUse]]
matcher = ".*"
hooks = [{ type = "command", command = "python3 @H@/hook.py" }]
